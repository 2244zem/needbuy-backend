                      unreadCount: { type: integer, example: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Tandai satu notifikasi sebagai sudah dibaca
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notifikasi ditandai terbaca
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unreadCount: { type: integer, example: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /addresses:
    get:
      tags: [Addresses]
      summary: Alamat milik user
      responses:
        "200":
          description: Daftar alamat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Addresses]
      summary: Tambah alamat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientName, phone, fullAddress, city, province, postalCode]
              additionalProperties: false
              properties:
                label: { type: string }
                recipientName: { type: string }
                phone: { type: string }
                fullAddress: { type: string }
                city: { type: string }
                province: { type: string }
                postalCode: { type: string, pattern: "^[0-9]{5}$" }
                isDefault: { type: boolean }
      responses:
        "201":
          description: Alamat dibuat
        "422": { $ref: "#/components/responses/ValidationError" }

  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Ubah alamat sendiri
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string }
                recipientName: { type: string }
                phone: { type: string }
                fullAddress: { type: string }
                city: { type: string }
                province: { type: string }
                postalCode: { type: string }
                isDefault: { type: boolean }
      responses:
        "200":
          description: Alamat diperbarui
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Addresses]
      summary: Hapus alamat sendiri
      description: Alamat yang pernah dipakai order tidak bisa dihapus (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Alamat dihapus
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /saved-products:
    get:
      tags: [Saved Products]
      summary: Produk tersimpan
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar produk tersimpan
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Saved Products]
      summary: Simpan produk
      description: Idempoten, menyimpan ulang produk yang sama bukan error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
      responses:
        "201":
          description: Produk disimpan
        "404": { $ref: "#/components/responses/NotFound" }

  /saved-products/{productId}:
    delete:
      tags: [Saved Products]
      summary: Hapus dari simpanan
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Dihapus
        "404": { $ref: "#/components/responses/NotFound" }

  /coupons:
    get:
      tags: [Coupons]
      summary: Daftar kupon
      description: |
        `scope=available` (default) mengembalikan kupon aktif yang belum diklaim
        user. `scope=mine` mengembalikan kupon yang sudah diklaim, termasuk yang
        sudah dipakai (`usedAt` terisi).
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [available, mine], default: available } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar kupon
        "401": { $ref: "#/components/responses/Unauthorized" }

  /coupons/claim:
    post:
      tags: [Coupons]
      summary: Klaim kupon lewat kode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 3, maxLength: 40 }
      responses:
        "201":
          description: Kupon tersimpan di akun
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Sudah diklaim sebelumnya, atau kuota habis

  /coupons/{id}/claim:
    post:
      tags: [Coupons]
      summary: Klaim kupon dari daftar
      description: |
        Kuota dijaga dengan compare-and-set di dalam transaction, dua klik
        barengan tidak bisa melewati `quota`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Kupon tersimpan di akun
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Sudah diklaim sebelumnya, atau kuota habis

  /messages/conversations:
    get:
      tags: [Messages]
      summary: Daftar percakapan
      description: |
        Berisi percakapan di mana user hadir sebagai pembeli maupun sebagai
        penjual, diurutkan dari pesan terbaru.

        Tiap percakapan membawa foto kedua pihak: `buyer.avatarUrl`, dan untuk
        sisi toko `seller.logoUrl` dengan cadangan `seller.user.avatarUrl`.
      responses:
        "200":
          description: Daftar percakapan beserta pesan terakhir dan jumlah belum dibaca
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Messages]
      summary: Mulai percakapan dengan penjual
      description: Get-or-create, memanggil ulang dengan seller yang sama mengembalikan percakapan yang ada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId]
              additionalProperties: false
              properties:
                sellerId: { type: string, format: uuid }
      responses:
        "201":
          description: Percakapan siap dipakai
        "400":
          description: Penjual adalah toko milik user sendiri
        "404": { $ref: "#/components/responses/NotFound" }

  /messages/conversations/{id}/messages:
    get:
      tags: [Messages]
      summary: Ambil pesan
      description: |
        Tanpa `after`, mengembalikan `limit` pesan terakhir urut lama ke baru.
        Dengan `after`, hanya pesan yang lebih baru dari timestamp itu, inilah
        yang dipakai client untuk polling realtime.

        Memanggil endpoint ini menandai pesan lawan bicara sebagai sudah dibaca.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Daftar pesan
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Messages]
      summary: Kirim pesan
      description: |
        Harus ada `body`, `imageUrl`, atau keduanya. Pesan kosong ditolak 400.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                imageUrl:
                  type: string
                  maxLength: 500
                  description: |
                    Hasil `POST /uploads/image`. Boleh dikirim sebagai URL
                    absolut (bentuk yang dikembalikan endpoint itu) maupun path
                    `/uploads/<id>`: server menormalkannya jadi **path**
                    sebelum disimpan.

                    Hostnya sengaja dibuang: host proyek ini tunnel yang
                    berganti terus, jadi menyimpan host berarti gambar chat
                    lama mati tiap kali tunnelnya ganti.

                    URL di luar `/uploads/<id>` ditolak, kalau tidak, chat
                    jadi corong untuk menautkan gambar dari mana saja, termasuk
                    pelacak dan berkas yang tidak pernah lewat pemeriksaan
                    magic bytes.
      responses:
        "201":
          description: Pesan terkirim
        "404": { $ref: "#/components/responses/NotFound" }

  /needs:
    get:
      tags: [Needs]
      summary: Daftar need milik user
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PROCESSING, COMPLETED] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar need
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Needs]
      summary: Kirim kebutuhan dalam teks bebas
      description: |
        Menyimpan input mentah lalu menjalankan interpreter.

        **Requirement dan preference BELUM dipersist di sini.** Hasil parse
        dikembalikan untuk dikonfirmasi user lewat `/needs/{id}/confirm`.

        Kalau interpreter gagal, response tetap 200 dengan
        `interpreted: false` dan arahan fallback ke pencarian produk biasa
        analisis kebutuhan tidak boleh jadi titik kegagalan tunggal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawInput]
              additionalProperties: false
              properties:
                rawInput:
                  type: string
                  minLength: 5
                  maxLength: 2000
                  example: laptop buat kuliah desain, budget 12 juta, RAM minimal 16GB
      responses:
        "201":
          description: Need dibuat (dengan hasil interpretasi atau arahan fallback)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      need: { $ref: "#/components/schemas/Need" }
                      interpreted: { type: boolean }
                      parsed: { $ref: "#/components/schemas/ParsedNeed" }
                      needsClarification: { type: boolean }
                      clarificationQuestions:
                        type: array
                        items: { type: string }
                      fallback: { type: string, enum: [TRADITIONAL_SEARCH] }
                      searchEndpoint: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: |
            Melebihi batas analisis (20 per 15 menit per user). Endpoint ini
            memakai limiter yang jauh lebih ketat daripada operasi tulis biasa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /needs/{id}:
    get:
      tags: [Needs]
      summary: Detail need beserta requirement dan preference
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail need
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Need" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Needs]
      summary: Ubah goal, budget, atau lokasi need
      description: |
        `rawInput` sengaja tidak bisa diubah, kalimat asli user harus tetap utuh
        sebagai jejak audit interpretasi. Kalau kebutuhannya berubah, buat need baru.

        `status` juga tidak diterima dari body; status hanya berubah lewat alur
        confirm/process.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                goal: { type: string, maxLength: 300, nullable: true }
                budget: { type: number, exclusiveMinimum: 0, nullable: true }
                location: { type: string, maxLength: 120, nullable: true }
      responses:
        "200":
          description: Need diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Need" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Needs]
      summary: Hapus need
      description: |
        Requirement, preference, dan recommendation ikut terhapus lewat cascade.
        Shopping plan yang terkait TIDAK ikut terhapus, relasinya opsional, jadi
        `needId`-nya menjadi null dan plan tetap milik user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Need dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /needs/{id}/requirements:
    post:
      tags: [Needs]
      summary: Tambah satu requirement
      description: |
        `isHard` WAJIB diisi eksplisit, tanpa nilai default. Hard requirement
        menyingkirkan produk dari rekomendasi, jadi tidak boleh menjadi `true`
        hanya karena field-nya lupa dikirim.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value, isHard]
              additionalProperties: false
              properties:
                key: { type: string, minLength: 1, maxLength: 60, example: ram }
                value: { type: string, minLength: 1, maxLength: 200, example: 16GB }
                isHard:
                  type: boolean
                  description: true = wajib, produk yang tidak memenuhinya langsung gugur
      responses:
        "201":
          description: Requirement ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      requirementKey: { type: string }
                      requirementValue: { type: string }
                      isHardRequirement: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /needs/{id}/requirements/{reqId}:
    delete:
      tags: [Needs]
      summary: Hapus satu requirement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reqId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Requirement dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /needs/{id}/preferences:
    post:
      tags: [Needs]
      summary: Tambah satu preference
      description: Preference hanya memengaruhi ranking; tidak pernah menyingkirkan produk.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              additionalProperties: false
              properties:
                key: { type: string, minLength: 1, maxLength: 60, example: berat }
                value: { type: string, minLength: 1, maxLength: 200, example: ringan }
                weight: { type: number, minimum: 0, maximum: 5, default: 1 }
      responses:
        "201":
          description: Preference ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      preferenceKey: { type: string }
                      preferenceValue: { type: string }
                      weight: { $ref: "#/components/schemas/Money" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /needs/{id}/preferences/{prefId}:
    delete:
      tags: [Needs]
      summary: Hapus satu preference
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: prefId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Preference dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Need sedang PROCESSING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /needs/{id}/confirm:
    post:
      tags: [Needs]
      summary: Konfirmasi (dan koreksi) hasil interpretasi
      description: Baru di sinilah requirement dan preference dipersist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                goal: { type: string, nullable: true }
                budget: { type: number, nullable: true }
                location: { type: string, nullable: true }
                categoryId: { type: string, format: uuid, nullable: true }
                requirements:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [key, value, isHard]
                    properties:
                      key: { type: string }
                      value: { type: string }
                      isHard: { type: boolean }
                preferences:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value: { type: string }
                      weight: { type: number, minimum: 0, maximum: 5 }
      responses:
        "200":
          description: Requirement dan preference tersimpan
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /needs/{id}/clarifications:
    get:
      tags: [Needs]
      summary: Riwayat dialog klarifikasi sebuah need
      description: >-
        Seluruh pertanyaan yang pernah diajukan beserta jawabannya, terurut
        giliran. Pertanyaan yang sudah dijawab tidak pernah dihapus supaya
        dialog bisa dilanjutkan lain hari dan bisa diaudit kalau hasil
        interpretasinya dipersoalkan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Riwayat dialog
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/NeedClarification" }
                      nextQuestion:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/NeedClarification"
                      turnsUsed: { type: integer }
                      turnsRemaining: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /needs/{id}/clarify:
    post:
      tags: [Needs]
      summary: Jawab satu pertanyaan klarifikasi
      description: >-
        Dialog bertahap: satu pertanyaan dijawab per panggilan, dan jawabannya
        bisa mengubah pertanyaan berikutnya. Menjawab "10 juta buat laptop"
        sekaligus menutup pertanyaan kategori.


        Jawaban TIDAK ditempel mentah ke need_requirements. Jawaban digabung
        dengan raw_input lalu dijalankan ulang lewat interpreter yang sama,
        sehingga hanya ada satu jalur ekstraksi.


        Dibatasi 5 giliran. Setelah itu `nextQuestion` selalu null dan
        `complete` true: need diproses apa adanya. `complete: true` berarti
        tidak ada lagi yang ditanyakan, BUKAN berarti semua bagian terisi.


        Persist requirement tetap terjadi di `POST /needs/{id}/confirm`, tidak
        di sini.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId:
                  type: string
                  format: uuid
                  description: id pertanyaan dari `nextQuestion`
                answer:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "10 juta"
      responses:
        "200":
          description: Hasil interpretasi terbaru beserta pertanyaan berikutnya
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      need: { $ref: "#/components/schemas/Need" }
                      nextQuestion:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/NeedClarification"
                      complete:
                        type: boolean
                        description: Tidak ada lagi pertanyaan tersisa
                      turnsUsed: { type: integer }
                      turnsRemaining: { type: integer }
                      history:
                        type: array
                        items:
                          type: object
                          properties:
                            field: { type: string }
                            question: { type: string }
                            answer: { type: string, nullable: true }
                            answeredAt: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Need atau pertanyaan klarifikasi tidak ditemukan
        "409":
          description: Pertanyaan ini sudah dijawab (CLARIFICATION_ALREADY_ANSWERED)
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Interpreter sedang tidak tersedia (INTERPRETER_UNAVAILABLE)

  /needs/{id}/process:
    post:
      tags: [Needs]
      summary: Jalankan matching, scoring, dan ranking
      description: |
        `PROCESSING -> matching -> scoring -> ranking -> COMPLETED`.
        Idempoten: memproses ulang need yang sama menimpa rekomendasi lama.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                categoryId: { type: string, format: uuid }
      responses:
        "200":
          description: Rekomendasi dihasilkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      total: { type: integer, description: Jumlah rekomendasi tersimpan }
                      evaluated: { type: integer, description: Kandidat yang lolos hard requirement }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: |
            Melebihi batas analisis (20 per 15 menit per user). Ini endpoint
            termahal di API: memindai kandidat, menghitung enam komponen skor
            per produk, lalu menulis ulang seluruh baris rekomendasi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /needs/{id}/recommendations:
    get:
      tags: [Needs]
      summary: Rekomendasi hasil pipeline, terurut ranking
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar rekomendasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Recommendation" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans:
    get:
      tags: [Shopping Plans]
      summary: Daftar shopping plan
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, READY, NEEDS_ADJUSTMENT] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar plan
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Shopping Plans]
      summary: Buat shopping plan
      description: Bisa kosong, atau diisi otomatis dari rekomendasi teratas sebuah need.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              additionalProperties: false
              properties:
                budget: { type: number, exclusiveMinimum: 0 }
                needId: { type: string, format: uuid }
                fromRecommendations: { type: boolean, default: false }
                maxItems: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "201":
          description: Plan dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/ShoppingPlan" }

  /shopping-plans/{id}:
    get:
      tags: [Shopping Plans]
      summary: Detail plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail plan
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Shopping Plans]
      summary: Ubah budget plan
      description: total, remaining, dan status dihitung ulang server.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              additionalProperties: false
              properties:
                budget: { type: number, exclusiveMinimum: 0 }
      responses:
        "200":
          description: Plan dihitung ulang
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans/{id}/items:
    post:
      tags: [Shopping Plans]
      summary: Tambah item ke plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, default: 1 }
      responses:
        "201":
          description: Item ditambahkan, plan dihitung ulang
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans/{id}/items/{itemId}:
    patch:
      tags: [Shopping Plans]
      summary: Ubah jumlah item
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Plan dihitung ulang
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Shopping Plans]
      summary: Hapus item dari plan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Plan dihitung ulang
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans/{id}/items/{itemId}/replace:
    put:
      tags: [Shopping Plans]
      summary: Ganti produk sebuah item
      description: Menandai item dengan isReplaced = true, lalu menghitung ulang plan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Item diganti, plan dihitung ulang
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans/{id}/alternatives:
    get:
      tags: [Shopping Plans]
      summary: Alternatif lebih murah per item
      description: Jalur "optimasi" saat plan over budget. Butuh plan yang terhubung ke need.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Alternatif per item
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shopping-plans/{id}/add-to-cart:
    post:
      tags: [Shopping Plans]
      summary: Masukkan semua item plan ke cart
      description: |
        Item yang gagal (stok kurang, produk nonaktif) dilaporkan per item
        alih-alih menggagalkan seluruh operasi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Hasil per item
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      added: { type: integer }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            productId: { type: string }
                            reason: { type: string }

  /cart:
    get:
      tags: [Cart]
      summary: Cart aktif milik user saat ini
      responses:
        "200":
          description: Detail Cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [Cart]
      summary: Kosongkan seluruh keranjang
      responses:
        "200":
          description: Cart dikosongkan

  /cart/count:
    get:
      tags: [Cart]
      summary: Hitung jumlah item / unread count dalam keranjang
      description: Mengembalikan jumlah variasi barang (unreadCount) dan total kuantitas (totalQuantity) di keranjang user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Jumlah item di keranjang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      unreadCount: { type: integer, example: 3 }
                      totalQuantity: { type: integer, example: 5 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cart/budget:
    patch:
      tags: [Cart]
      summary: Set atau hapus budget cart
      description: Bersifat informatif, tidak memblokir checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              additionalProperties: false
              properties:
                budget: { type: number, nullable: true, minimum: 0 }
      responses:
        "200":
          description: Budget diperbarui

  /cart/items:
    post:
      tags: [Cart]
      summary: Tambah item ke cart
      description: |
        Body hanya membawa productId, quantity, dan varian pilihan. Harga
        di-snapshot server saat item masuk dan tidak ikut berubah kalau seller
        mengubah harga. Stock dicek langsung ke database saat itu juga.

        **Diskon grosir** dihitung server saat menyimpan: kalau `quantity`
        mencapai `bulkMinQty` produk, `subtotal` sudah memuat potongannya
        (`lib/bulkPrice.ts`). Harga satuan yang di-snapshot tetap; yang
        bergantung jumlah hanya potongannya, jadi menambah/mengurangi jumlah
        membuat potongan itu muncul/hilang.

        **Penjual tidak bisa membeli dari tokonya sendiri.** Produk milik toko
        sendiri ditolak `403 SELF_PURCHASE_FORBIDDEN`. Penjaga yang sama ada di
        `POST /checkout`, jadi item yang sudah terlanjur di keranjang pun tidak
        bisa dibayar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, default: 1 }
                variant:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: |
                    Model/varian yang dipilih pembeli, mis. `"Warna: Hitam"`.
                    Teks siap tampil, bukan id: varian di proyek ini berasal
                    dari `product_attributes`, bukan tabel varian dengan stok
                    sendiri. Nilainya ikut disnapshot ke `order_items.variant`
                    saat checkout.
      responses:
        "201":
          description: Item ditambahkan
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stok tidak mencukupi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Ubah jumlah item cart
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Item diperbarui
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Cart]
      summary: Hapus item cart
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Item dihapus
        "404": { $ref: "#/components/responses/NotFound" }

  /checkout/preview:
    post:
      tags: [Checkout]
      summary: Pratinjau checkout per seller
      description: Menjalankan pengelompokan dan perhitungan di memori. TIDAK menulis apa pun.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shippingCost: { type: number, minimum: 0, default: 0 }
                cartItemIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                  description: |
                    Item cart yang ikut di-checkout. Dihilangkan = seluruh isi
                    cart. Id yang tidak ada di cart user ditolak 400
                    (`CART_ITEM_NOT_FOUND`), bukan diabaikan diam-diam.
      responses:
        "200":
          description: Ringkasan per seller beserta masalah stok kalau ada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      orderCount: { type: integer }
                      grandTotal: { $ref: "#/components/schemas/Money" }
                      canCheckout: { type: boolean }
                      orders:
                        type: array
                        items:
                          type: object
                          properties:
                            sellerId: { type: string, format: uuid }
                            storeName: { type: string, nullable: true }
                            subtotal: { $ref: "#/components/schemas/Money" }
                            shippingCost: { $ref: "#/components/schemas/Money" }
                            total: { $ref: "#/components/schemas/Money" }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  cartItemId: { type: string, format: uuid }
                                  productId: { type: string, format: uuid }
                                  productName: { type: string }
                                  productSlug: { type: string }
                                  imageUrl: { type: string, nullable: true }
                                  quantity: { type: integer }
                                  variant: { type: string, nullable: true }
                                  price: { $ref: "#/components/schemas/Money" }
                                  subtotal:
                                    allOf:
                                      - { $ref: "#/components/schemas/Money" }
                                      - description: Sudah memuat potongan grosir kalau jumlahnya memenuhi.
                                  bulkDiscountPercent:
                                    type: integer
                                    description: Potongan grosir yang didapat baris ini (0 = harga normal).
                      stockProblems:
                        type: array
                        items:
                          type: object
                          properties:
                            cartItemId: { type: string, format: uuid }
                            productId: { type: string }
                            productName: { type: string }
                            requested: { type: integer }
                            available: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /checkout:
    post:
      tags: [Checkout]
      summary: Buat order (dikelompokkan per seller)
      description: |
        Satu transaction: validasi ulang stok, kelompokkan per seller, buat satu
        order per seller, kurangi stok, buat payment PENDING, kosongkan cart.

        **Satu order = satu seller.** Cart dengan tiga seller menghasilkan tiga order.

        Snap transaction dibuat SETELAH transaction commit, panggilan HTTPS ke
        gateway tidak boleh menahan lock database.

        Header `Idempotency-Key` wajib.

        **Penjual tidak bisa membeli dari tokonya sendiri.** Kalau ada satu saja
        item milik toko sendiri, seluruh checkout ditolak `403
        SELF_PURCHASE_FORBIDDEN` — tanpa ini penjual bisa menyelesaikan
        pesanannya sendiri lalu menulis ulasan bintang lima untuk tokonya.
        Ceknya ada DI DALAM transaction, jadi mendaftar jadi penjual setelah
        barang masuk keranjang tetap tertahan.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              additionalProperties: false
              properties:
                addressId: { type: string, format: uuid }
                cartItemIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                  description: |
                    Item cart yang ikut di-checkout. Dihilangkan = seluruh isi
                    cart. Id yang tidak ada di cart user ditolak 400
                    (`CART_ITEM_NOT_FOUND`), bukan diabaikan diam-diam.
                shippingCost: { type: number, minimum: 0, default: 0 }
                notes: { type: string, maxLength: 500 }
                couponCode:
                  type: string
                  maxLength: 64
                  description: |
                    Kode kupon yang **sudah diklaim** user. Nominal potongannya
                    dihitung ulang di server: client tidak pernah mengirim
                    angka potongan.

                    Syarat minimal belanja diukur dari subtotal SELURUH
                    checkout (semua toko), tanpa ongkir. Potongannya lalu dibagi
                    ke tiap order sebanding subtotalnya, jadi pembatalan
                    sebagian tetap bisa dihitung.

                    Ditolak 400 kalau belum diklaim (`COUPON_NOT_CLAIMED`),
                    sudah kepakai (`COUPON_ALREADY_USED`), kedaluwarsa
                    (`COUPON_EXPIRED`), atau belum memenuhi minimal belanja
                    (`COUPON_MIN_SPEND_NOT_MET`).
                paymentMethod:
                  type: string
                  enum: [MIDTRANS, COD, NEEDPAY]
                  default: MIDTRANS
      responses:
        "201":
          description: |
            Order dibuat, satu per seller. Setiap checkout yang sukses juga
            mengundi satu kupon hadiah dari kumpulan `isReward`, kegagalan
            undian tidak pernah menggagalkan pesanan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      orderCount: { type: integer }
                      orders:
                        type: array
                        items:
                          type: object
                          properties:
                            orderId: { type: string, format: uuid }
                            orderNumber: { type: string }
                            payment: { $ref: "#/components/schemas/Payment" }
        "400":
          description: Cart kosong, atau Idempotency-Key tidak ada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Stok tidak mencukupi, bentrok stok, atau Idempotency-Key dipakai ulang
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /reviews/{orderId}/{itemId}:
    post:
      tags: [Reviews]
      summary: Buat review untuk item pesanan
      description: |
        Review hanya bisa dibuat setelah pesanan berstatus COMPLETED.
        Setiap item hanya bisa direview sekali.

        Pesanan dari toko sendiri ditolak `403 SELF_PURCHASE_FORBIDDEN`. Order
        seperti itu semestinya tidak pernah terbentuk, tapi data lama tetap
        tidak boleh berubah jadi ulasan — rating produk dan toko dihitung dari
        sini.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  maxLength: 2000
                  example: Produk sesuai deskripsi, pengiriman cepat!
                media:
                  type: array
                  maxItems: 5
                  description: |
                    Foto/video ulasan. Isinya URL hasil `POST /uploads/image`
                    (endpoint itu menerima gambar DAN video pendek, jenisnya
                    ditentukan server dari magic bytes, bukan dari `kind` di
                    sini). Lampiran ditulis dalam transaction yang sama dengan
                    ulasannya.
                  items:
                    type: object
                    required: [url]
                    additionalProperties: false
                    properties:
                      url: { type: string, format: uri, maxLength: 2000 }
                      kind: { type: string, enum: [IMAGE, VIDEO], default: IMAGE }
      responses:
        "201":
          description: Review berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Review" }
        "400":
          description: Review sudah ada atau pesanan belum selesai
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Item tidak ditemukan

  /reviews/product/{id}:
    get:
      tags: [Reviews]
      summary: Daftar review sebuah produk
      description: |
        `meta` membawa `average` dan `breakdown` (jumlah ulasan per bintang)
        yang dihitung dari SELURUH ulasan produk, bukan dari halaman yang
        sedang tampil: bar "5 bintang: 12" yang berubah tiap ganti halaman
        itu salah.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar review produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/PaginationMeta" }
                      - type: object
                        properties:
                          average: { type: number, example: 4.6 }
                          breakdown:
                            type: array
                            description: Selalu lima baris, bintang 5 lebih dulu.
                            items:
                              type: object
                              properties:
                                star: { type: integer, minimum: 1, maximum: 5 }
                                count: { type: integer }
        "404":
          description: Produk tidak ditemukan

  /reports:
    post:
      tags: [Reports]
      summary: Laporkan produk, toko, atau ulasan
      description: |
        Prioritas laporan TIDAK ikut dikirim client, kalau pelapor yang
        menentukan, semua laporan akan jadi `HIGH`. Yang menaikkan prioritas
        adalah admin lewat `PATCH /admin/reports/{id}`.

        Nama sasaran (`targetLabel`) diambil server dari database saat laporan
        dibuat, bukan dari client: kalau labelnya dikirim client, siapa pun bisa
        melaporkan UUID acak dengan nama toko orang lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              additionalProperties: false
              properties:
                targetType: { type: string, enum: [PRODUCT, SELLER, REVIEW] }
                targetId: { type: string, format: uuid }
                reason: { type: string, minLength: 4, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Laporan tercatat berstatus OPEN
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Sudah pernah melaporkan sasaran yang sama (`REPORT_DUPLICATE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /orders:
    get:
      tags: [Orders]
      summary: Daftar order milik user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        - name: q
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/export:
    get:
      tags: [Orders]
      summary: Export order milik user dalam format CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        - name: q
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: File CSV order
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Detail order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail order
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Ubah status order
      description: |
        Transisi yang sah: `PROCESSING -> SHIPPED -> DELIVERED -> COMPLETED`.

        SHIPPED dan DELIVERED hanya boleh oleh seller pemilik order.
        COMPLETED hanya oleh buyer pemilik order.
        PROCESSING datang dari webhook pembayaran, bukan dari endpoint ini.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [SHIPPED, DELIVERED, COMPLETED] }
      responses:
        "200":
          description: Status diubah
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Transisi status tidak sah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Batalkan order
      description: |
        Hanya dari WAITING_PAYMENT, dan hanya oleh pemilik order.
        Stok dikembalikan dalam transaction yang sama.
        Header `Idempotency-Key` wajib, dijalankan dua kali akan
        mengembalikan stok dua kali.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Order dibatalkan, stok dikembalikan
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{orderId}/items/{itemId}/review:
    post:
      tags: [Orders]
      summary: Review sebuah item order
      description: |
        Syarat: order milik user, status COMPLETED, dan item belum pernah
        direview. Rating produk dan seller dihitung ulang dalam transaction
        yang sama.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Review dibuat, rating dihitung ulang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Review" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order belum COMPLETED, atau item sudah pernah direview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Ringkasan agregat (ADMIN)
      description: |
        Semua hitungan dijalankan dalam satu transaction supaya angkanya
        konsisten satu sama lain, bukan potret dari beberapa waktu berbeda.

        Hanya order yang pembayarannya `PAID` yang dihitung, order yang masih
        menunggu bayar bukan pendapatan.

        `revenue.gmv` adalah omzet kotor seluruh toko. `revenue.platform` adalah
        bagian pemilik aplikasi: `gmv * commissionPercent / 100`. Yang tampil
        sebagai "Total Pendapatan" di panel admin adalah `platform`, BUKAN
        `gmv`: keduanya gampang tertukar. Persennya dibaca dari AdminConfig
        `PLATFORM_COMMISSION_PERCENT` (default 30).
      responses:
        "200":
          description: Ringkasan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties: { total: { type: integer } }
                      sellers:
                        type: object
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          suspended: { type: integer }
                      products:
                        type: object
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          inactive: { type: integer }
                      needs:
                        type: object
                        properties:
                          total: { type: integer }
                          completed: { type: integer }
                      orders:
                        type: object
                        properties:
                          total: { type: integer }
                          paid: { type: integer }
                      revenue:
                        type: object
                        properties:
                          commissionPercent: { type: number, example: 30 }
                          gmv: { type: number, example: 9548900 }
                          platform: { type: number, example: 2864670 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [Admin]
      summary: Daftar user (ADMIN)
      description: |
        Memakai daftar kolom publik yang sama dengan endpoint lain, admin pun
        tidak pernah menerima `passwordHash`.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [BUYER, SELLER, ADMIN] } }
        - { name: q, in: query, description: Cari pada nama atau email, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/analytics:
    get:
      tags: [Admin]
      summary: Agregat halaman Analytics (ADMIN)
      description: |
        Sudutnya berbeda dari `/admin/dashboard`: dashboard menjawab "berapa
        totalnya sekarang", endpoint ini menjawab "bergerak ke mana dalam 30
        hari terakhir". Semua angka dibandingkan terhadap 30 hari sebelumnya.

        `revenue` adalah komisi platform, bukan GMV, definisi yang sama dengan
        dashboard. `conversionRate` = order dibayar per kunjungan produk
        (`product_views`), bukan per pengunjung unik: tamu tanpa akun tidak bisa
        dihitung unik.

        Field di `changes` bernilai `null` kalau periode sebelumnya nol
        pertumbuhan dari nol tidak punya nilai persen yang benar.
      responses:
        "200":
          description: Agregat analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      windowDays: { type: integer, example: 30 }
                      totals:
                        type: object
                        properties:
                          revenue: { type: number }
                          orders: { type: integer }
                          activeUsers: { type: integer }
                          conversionRate: { type: number }
                      changes:
                        type: object
                        properties:
                          revenue: { type: number, nullable: true }
                          orders: { type: number, nullable: true }
                          activeUsers: { type: number, nullable: true }
                          conversionRate: { type: number, nullable: true }
                      revenueSeries:
                        type: array
                        items:
                          type: object
                          properties:
                            month: { type: string, example: "2026-08" }
                            revenue: { type: number }
                      topCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            revenue: { type: number }
                            percentage: { type: integer }
                      topStores:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            sales: { type: number }
                            growth: { type: number, nullable: true }
                      ordersByStatus:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string }
                            count: { type: integer }
                            percentage: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/orders:
    get:
      tags: [Admin]
      summary: Daftar semua order (ADMIN)
      description: |
        Tanpa filter kepemilikan, itulah gunanya. Tetap tidak menyertakan
        `snapToken` / `snapRedirectUrl`: token pembayaran milik pembeli dan
        tidak perlu ada di panel admin.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        - name: paymentStatus
          in: query
          description: Saring berdasarkan status pembayaran order.
          schema:
            type: string
            enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED]
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar order
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/products:
    get:
      tags: [Admin]
      summary: Daftar produk lintas toko (ADMIN)
      description: |
        Beda dari `GET /products` publik dalam satu hal yang menentukan: tidak
        dikunci `isActive: true`. Justru produk nonaktif, yang di panel disebut
        "belum disetujui", yang paling perlu dilihat admin. Skema ini tidak
        punya alur persetujuan terpisah, jadi `isActive=false` adalah antrean
        itu sendiri.
      parameters:
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: sellerId
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Cari di nama produk atau SKU.
          schema: { type: string, maxLength: 120 }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        sku: { type: string, nullable: true }
                        price: { $ref: "#/components/schemas/Money" }
                        stock: { type: integer }
                        isActive: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        category:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                        seller:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            storeName: { type: string }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/products/{id}/active:
    patch:
      tags: [Admin]
      summary: Aktifkan atau nonaktifkan produk (ADMIN)
      description: |
        Moderasi katalog lintas toko, jadi tanpa cek kepemilikan, sengaja
        dipisah dari `PATCH /products/{id}` supaya jalur penjual tetap tidak
        bisa menyentuh produk toko lain. Perubahan nyata dicatat di audit log;
        menyetel ke nilai yang sudah berlaku tidak dicatat.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              additionalProperties: false
              properties:
                isActive: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Status produk diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      changed: { type: boolean }
                      isActive: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/coupons:
    get:
      tags: [Admin]
      summary: Daftar semua kupon (ADMIN)
      description: |
        Termasuk kupon nonaktif dan kedaluwarsa, berbeda dari `GET /coupons`
        yang hanya menampilkan kupon yang masih boleh diklaim pembeli.
      parameters:
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar kupon
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Admin]
      summary: Buat kupon (ADMIN)
      description: |
        `code` dibakukan huruf besar dan hanya boleh huruf, angka, dan tanda
        hubung, supaya tidak ada dua kode yang "sama" tapi berbeda. Kupon
        `PERCENT` dibatasi maksimal 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, type, value]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 3, maxLength: 40, pattern: "^[A-Z0-9-]+$" }
                title: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                type: { type: string, enum: [PERCENT, FIXED, FREE_SHIPPING] }
                category: { type: string, enum: [SHIPPING, CASHBACK, DISCOUNT], default: DISCOUNT }
                value: { type: number, minimum: 0 }
                minSpend: { type: number, minimum: 0 }
                maxDiscount: { type: number, minimum: 0, nullable: true }
                quota: { type: integer, minimum: 1, nullable: true }
                startsAt: { type: string, format: date-time, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
                isActive: { type: boolean }
      responses:
        "201":
          description: Kupon dibuat
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Kode kupon sudah dipakai (`COUPON_CODE_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/coupons/{id}:
    patch:
      tags: [Admin]
      summary: Ubah kupon (ADMIN)
      description: |
        `code` sengaja TIDAK bisa diubah: kode sudah beredar di tangan pembeli
        dan tercatat di kupon yang mereka klaim. Ganti kode = bikin kupon baru.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500, nullable: true }
                value: { type: number, minimum: 0 }
                minSpend: { type: number, minimum: 0 }
                maxDiscount: { type: number, minimum: 0, nullable: true }
                quota: { type: integer, minimum: 1, nullable: true }
                startsAt: { type: string, format: date-time, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
                isActive: { type: boolean }
      responses:
        "200":
          description: Kupon diperbarui
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/withdrawals:
    get:
      tags: [Admin]
      summary: Antrean penarikan saldo penjual (ADMIN)
      description: |
        Penarikan disimpan sebagai baris `wallet_transactions` bertipe
        `WITHDRAWAL`, bukan tabel sendiri, saldo tetap punya satu buku besar.
        Arti statusnya: `PENDING` menunggu admin, `SUCCESS` dana sudah
        ditransfer, `FAILED` ditolak dan saldonya sudah dikembalikan.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SUCCESS, FAILED] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar permintaan penarikan
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/withdrawals/{id}:
    patch:
      tags: [Admin]
      summary: Setujui atau tolak penarikan (ADMIN)
      description: |
        `APPROVE` tidak menyentuh saldo: nominalnya sudah dipotong saat penjual
        mengajukan. `REJECT` mengembalikan nominal itu ke saldo penjual.
        Keduanya tercatat di audit log.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Penarikan diproses
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Penarikan sudah pernah diproses (`WITHDRAWAL_ALREADY_HANDLED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/reports:
    get:
      tags: [Admin]
      summary: Daftar laporan pengguna (ADMIN)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, INVESTIGATING, RESOLVED] }
        - name: priority
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH] }
        - name: targetType
          in: query
          schema: { type: string, enum: [PRODUCT, SELLER, REVIEW] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar laporan
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reports/{id}:
    patch:
      tags: [Admin]
      summary: Ubah status atau prioritas laporan (ADMIN)
      description: |
        Prioritas hanya bisa diubah admin, kalau pelapor yang menentukan,
        semua laporan akan jadi `HIGH`. Status `RESOLVED` sekaligus mencatat
        `resolvedAt`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                status: { type: string, enum: [OPEN, INVESTIGATING, RESOLVED] }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
                resolution: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Laporan diperbarui
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/reviews:
    get:
      tags: [Admin]
      summary: Daftar ulasan lintas produk (ADMIN)
      description: |
        Termasuk ulasan yang sudah disembunyikan, justru itu yang perlu
        ditinjau ulang.
      parameters:
        - name: isHidden
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: rating
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar ulasan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        rating: { type: integer }
                        comment: { type: string, nullable: true }
                        isHidden: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        user:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                        product:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            category:
                              type: object
                              properties:
                                name: { type: string }
                            seller:
                              type: object
                              properties:
                                storeName: { type: string }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reviews/{id}/hidden:
    patch:
      tags: [Admin]
      summary: Sembunyikan atau tampilkan kembali ulasan (ADMIN)
      description: |
        Menyembunyikan, BUKAN menghapus: rating produk dan penjual diturunkan
        dari ulasan yang tampil, dan menghapus barisnya berarti kehilangan jejak
        kenapa angka itu berubah. Menyembunyikan juga bisa dibatalkan.

        Rating produk dan penjual dihitung ulang di transaction yang sama
        rating yang tertinggal di nilai lama lebih menyesatkan daripada ulasan
        yang masih tampil.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isHidden]
              additionalProperties: false
              properties:
                isHidden: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Status ulasan diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      changed: { type: boolean }
                      isHidden: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/payments:
    get:
      tags: [Admin]
      summary: Daftar semua pembayaran (ADMIN)
      description: |
        Tanpa filter kepemilikan. `snapToken` / `snapRedirectUrl` sengaja tidak
        ikut: itu kredensial bayar milik pembeli, dan panel admin tidak butuh
        kemampuan menyelesaikan pembayaran orang lain. `rawResponse` juga tidak
        payload mentah gateway hanya untuk audit di database.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED]
        - name: method
          in: query
          description: Hanya dua metode yang mungkin ada di skema ini.
          schema:
            type: string
            enum: [MIDTRANS, COD]
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar pembayaran
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
                        method: { type: string, nullable: true }
                        midtransOrderId: { type: string }
                        midtransTransactionId: { type: string, nullable: true }
                        paidAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        order:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            orderNumber: { type: string }
                            total: { $ref: "#/components/schemas/Money" }
                            user:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                email: { type: string, format: email }
                            seller:
                              type: object
                              properties:
                                storeName: { type: string }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Jejak audit aksi admin (ADMIN)
      description: |
        `metadata` hanya memuat konteks perubahan (nilai lama ke nilai baru dan
        alasannya). Tidak pernah memuat password, token, atau kredensial
        catatan audit yang berisi rahasia berubah dari alat investigasi menjadi
        sumber kebocoran.
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 60 } }
        - { name: targetType, in: query, schema: { type: string, maxLength: 60 } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        actorUserId: { type: string, format: uuid }
                        action:
                          type: string
                          enum:
                            [
                              SELLER_STATUS_CHANGED,
                              CATEGORY_CREATED,
                              CATEGORY_UPDATED,
                              CATEGORY_DELETED,
                            ]
                        targetType: { type: string }
                        targetId: { type: string, nullable: true }
                        metadata: { type: object, nullable: true }
                        ip: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/stores:
    get:
      tags: [Admin]
      summary: Daftar semua toko/seller (ADMIN)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar toko
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/sellers/{id}/status:
    patch:
      tags: [Admin]
      summary: Aktifkan atau suspend toko (ADMIN)
      description: |
        Efeknya nyata di matching engine: seller `SUSPENDED` mendapat
        `sellerScore` 0, jadi produknya praktis tenggelam dari rekomendasi tanpa
        perlu dinonaktifkan satu per satu.

        Tercatat di audit log sebagai `SELLER_STATUS_CHANGED`. Menyetel status ke
        nilai yang sudah berlaku mengembalikan `changed: false` dan **tidak**
        dicatat: mencatat non-peristiwa hanya membuat jejak audit berisik
        sehingga aksi sungguhan lebih sulit ditemukan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
                reason:
                  type: string
                  maxLength: 500
                  description: Ikut tercatat di audit log. Sangat dianjurkan.
      responses:
        "200":
          description: Status toko diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      seller: { $ref: "#/components/schemas/Seller" }
                      changed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/configs:
    get:
      tags: [Admin]
      summary: Ambil semua konfigurasi sistem (ADMIN)
      description: Mengembalikan seluruh key-value config yang disimpan di database.
      responses:
        "200":
          description: Daftar konfigurasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      simulatedPaymentGateway: { type: boolean }
                      configs:
                        type: object
                        additionalProperties: { type: string }
                        description: Peta key -> value seluruh AdminConfig yang tersimpan.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Set atau update konfigurasi (ADMIN)
      description: Jika key sudah ada, nilainya di-update. Jika belum ada, dibuat baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              additionalProperties: false
              properties:
                key:
                  type: string
                  description: Nama konfigurasi. Hanya key dari daftar putih yang diterima.
                  enum:
                    - SIMULATED_PAYMENT_GATEWAY_MODE
                    - PLATFORM_COMMISSION_PERCENT
                    - MARKETPLACE_NAME
                    - MARKETPLACE_DESCRIPTION
                    - BRAND_LOGO_URL
                    - BRAND_FAVICON_URL
                    - MARKETPLACE_TIMEZONE
                value: { type: string, maxLength: 2000, description: Nilai konfigurasi }
      responses:
        "200":
          description: Konfigurasi disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      key: { type: string }
                      value: { type: string }
                      updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/configs/simulated-gateway:
    post:
      tags: [Admin]
      summary: Toggle simulated payment gateway (ADMIN)
      description: Mengaktifkan atau menonaktifkan simulated gateway untuk testing tanpa Midtrans.
      responses:
        "200":
          description: Status simulated gateway diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      simulatedGateway: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/profile:
    get:
      tags: [Admin]
      summary: Ambil profil admin sendiri (ADMIN)
      responses:
        "200":
          description: Profil admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      username: { type: string }
                      fullName: { type: string, nullable: true }
                      email: { type: string }
                      role: { type: string, enum: [ADMIN] }
                      photoUrl: { type: string, nullable: true }
                      createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Admin]
      summary: Update profil admin sendiri (ADMIN)
      description: Update nama, email, password baru, atau foto profil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                newPassword: { type: string, minLength: 8, maxLength: 100 }
                photoUrl: { type: string, format: uri }
      responses:
        "200":
          description: Profil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      username: { type: string }
                      fullName: { type: string, nullable: true }
                      email: { type: string }
                      role: { type: string }
                      photoUrl: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/profile/photo:
    post:
      tags: [Admin]
      summary: Upload URL foto profil (ADMIN)
      description: Menyimpan URL foto profil admin. Foto sebelumnya akan digantikan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrl]
              additionalProperties: false
              properties:
                photoUrl: { type: string, format: uri }
      responses:
        "200":
          description: Foto profil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      photoUrl: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /payments/midtrans/webhook:
    post:
      tags: [Payments]
      summary: Notifikasi pembayaran Midtrans
      description: |
        Endpoint publik. Payload tidak dipercaya sampai signature terbukti benar:
        `sha512(order_id + status_code + gross_amount + serverKey)`.

        Idempoten: Midtrans mengulang notifikasi, dan pengulangan itu lalu
        lintas normal. Selalu 200 untuk payload bersignature benar.

        **Tidak di-rate-limit**: membatasi endpoint ini berarti membuang
        notifikasi pembayaran yang sah.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key, transaction_status]
              properties:
                order_id: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                signature_key: { type: string }
                transaction_status: { type: string }
                transaction_id: { type: string }
                payment_type: { type: string }
      responses:
        "200":
          description: Notifikasi diproses (termasuk duplikat)
        "403":
          description: Signature tidak valid, tidak ada yang ditulis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/admin-profile/{id}:
    get:
      tags: [Admin]
      summary: Lihat profil publik admin (semua role)
      description: Endpoint publik untuk melihat profil admin berdasarkan ID.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Profil publik admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      username: { type: string }
                      fullName: { type: string, nullable: true }
                      photoUrl: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/settings:
    get:
      tags: [Admin]
      summary: Branding marketplace (publik)
      description: >-
        Nama, deskripsi, logo, dan favicon marketplace. Daftar putih, config
        lain (termasuk flag gateway simulasi) tidak ikut terekspos.
      security: []
      responses:
        "200":
          description: Branding marketplace
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      MARKETPLACE_NAME: { type: string }
                      MARKETPLACE_DESCRIPTION: { type: string }
                      BRAND_LOGO_URL: { type: string }
                      BRAND_FAVICON_URL: { type: string }

  /payments/{orderId}:
    get:
      tags: [Payments]
      summary: Status pembayaran sebuah order
      description: rawResponse dari gateway sengaja tidak diekspos.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payments/{orderId}/sync:
    post:
      tags: [Payments]
      summary: Tarik status pembayaran dari Midtrans
      description: |
        Menanyakan status transaksi langsung ke API Midtrans lalu menjalankannya
        lewat handler yang sama dengan webhook, termasuk pengecekan nominal dan
        larangan menurunkan status yang sudah PAID.

        Dipakai sebagai jaring pengaman kalau notifikasi webhook tidak sampai
        (server sedang mati, URL notifikasi belum didaftarkan, tunnel dev
        berganti). Client hanya memicu; status yang dipakai datang dari Midtrans.

        Idempoten: aman dipanggil berulang, tidak butuh `Idempotency-Key`.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            `synced: false` dengan `reason: NO_TRANSACTION` berarti belum ada
            transaksi untuk order ini di Midtrans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      synced: { type: boolean }
                      reason: { type: string, enum: [NO_TRANSACTION] }
                      payment: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order memakai COD, tidak ada transaksi online
        "503":
          description: Gateway pembayaran tidak bisa dihubungi

  /payments/{orderId}/retry:
    post:
      tags: [Payments]
      summary: Terbitkan ulang Snap transaction
      description: |
        Untuk order yang masih WAITING_PAYMENT.

        `midtransOrderId` HANYA diganti kalau id lama sudah dipakai transaksi
        yang berakhir gagal (expire/deny/cancel): Midtrans menolak order_id
        yang pernah terpakai. Kalau belum ada transaksinya, id lama dipakai
        ulang; kalau transaksinya masih `pending`, halaman pembayaran yang ada
        dikembalikan apa adanya supaya tidak terbuka dua kanal bayar.

        Status gateway ditarik lebih dulu, jadi order yang ternyata sudah
        dibayar (notifikasi webhook tidak sampai) langsung tercatat dan
        endpoint ini membalas 409 `ALREADY_PAID`.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Snap token baru
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/needs/interpret:
    post:
      tags: [AI]
      summary: Interpretasi teks kebutuhan pengguna (berbasis aturan)
      description: >-
        Mengekstrak goal, budget, lokasi, kategori, requirement, dan preferensi
        dari kalimat bebas bahasa Indonesia. Murni berbasis aturan, tidak ada
        model bahasa yang dipanggil, tidak ada biaya per request.


        Requirement bertanda "minimal/wajib/harus" menjadi hard requirement yang
        MENYINGKIRKAN produk di matching engine; sisanya hanya memengaruhi
        ranking. Penanda hanya berlaku di dalam klausanya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawInput]
              properties:
                rawInput:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: "butuh laptop acer budget 7jt ram minimal 8gb"
      responses:
        "200":
          description: Hasil interpretasi beserta pertanyaan klarifikasi bila ada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      interpretation:
                        type: object
                        properties:
                          goal: { type: string, nullable: true }
                          budget: { type: integer, nullable: true, example: 7000000 }
                          location: { type: string, nullable: true }
                          category: { type: string, nullable: true, example: laptop }
                          requirements:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string, example: ram }
                                value: { type: string, example: 8GB }
                                isHardRequirement: { type: boolean }
                          preferences:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                value: { type: string }
                                weight: { type: number }
                      needsClarification: { type: boolean }
                      clarificationQuestions:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              enum: [budget, category, goal, requirement]
                            question: { type: string }
                            context: { type: string }
                      confidenceScore:
                        type: number
                        minimum: 0
                        maximum: 1
                        description: >-
                          Seberapa banyak bagian penting yang berhasil terbaca,
                          bukan probabilitas. Dibatasi 0.3 kalau input absurd.
                      absurdityDetected: { type: boolean }
                      absurdityNotes: { type: array, items: { type: string } }
                      issues:
                        type: array
                        items:
                          type: object
                          properties:
                            severity: { type: string, enum: [critical, warning] }
                            code: { type: string, example: ABSURD_SPEC }
                            message: { type: string }
                            suggestion: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/needs/similar:
    post:
      tags: [AI]
      summary: Cari kebutuhan serupa milik sendiri
      description: >-
        Kemiripan dihitung dengan Jaccard atas himpunan token goal dan
        rawInput. Hanya need MILIK USER YANG SAMA yang dibandingkan, riwayat
        kebutuhan orang lain tidak pernah ikut terbaca. Dibatasi 200 need
        terbaru.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [needId]
              properties:
                needId: { type: string, format: uuid }
                limit: { type: integer, default: 5, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Daftar kebutuhan yang mirip, terurut dari skor tertinggi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      similarNeeds:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            score: { type: number, minimum: 0, maximum: 1 }
                            goal: { type: string, nullable: true }
                            rawInput: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Need yang diminta bukan milik user ini
        "404":
          description: Need tidak ditemukan
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/plans/generate:
    post:
      tags: [AI]
      summary: Generate opsi rencana belanja (Shopping Plans)
      description: >-
        Menghasilkan sampai dua rencana dari daftar produk kandidat yang
        dikirim pemanggil: `budget_minimal` (termurah) dan `optimal` (rating
        tertinggi yang masih di dalam budget). Rencana kedua dilewati kalau
        produknya sama dengan yang pertama.


        Satu produk per rencana. Rencana multi-item yang benar-benar
        mengoptimalkan budget belum diimplementasikan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [need_id, budget]
              properties:
                need_id: { type: string, format: uuid }
                budget: { type: integer, minimum: 0, example: 7000000 }
                requirements: { type: array, items: { type: object } }
                preferences: { type: array, items: { type: object } }
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      price: { type: number }
                      rating: { type: number, nullable: true }
      responses:
        "200":
          description: Opsi rencana belanja yang direkomendasikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      plans:
                        type: array
                        maxItems: 2
                        items:
                          type: object
                          properties:
                            strategy: { type: string, enum: [budget_minimal, optimal] }
                            totalPrice: { type: number }
                            score: { type: number }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  productId: { type: string }
                                  name: { type: string }
                                  price: { type: number }
                                  quantity: { type: integer }
                                  reason: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/insights:
    post:
      tags: [AI]
      summary: Rangkuman insight belanja
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                need_goal: { type: string, maxLength: 500 }
                budget: { type: integer, minimum: 0 }
                product_count: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Rangkuman insight belanja
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      insight:
                        type: object
                        properties:
                          summary: { type: string }
                          recommendationReason: { type: string }
                          confidenceScore:
                            type: number
                            description: >-
                              Diturunkan dari banyaknya kandidat rekomendasi.
                              Nol rekomendasi menghasilkan 0.2.
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/market/pulse:
    post:
      tags: [AI]
      summary: Analisis harga rata-rata dan urgensi stok
      description: >-
        `priceTrend` selalu bernilai `unknown`: tren harga butuh riwayat harga,
        sedangkan tabel products hanya menyimpan harga saat ini. Field-nya
        dipertahankan supaya klien tidak pecah, tapi jangan ditampilkan sebagai
        fakta.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_ids: { type: array, items: { type: string } }
                products_data:
                  type: array
                  items:
                    type: object
                    properties:
                      price: { type: number }
                      stock: { type: integer }
      responses:
        "200":
          description: Analisis harga dan urgensi stok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      analysis:
                        type: object
                        properties:
                          priceTrend: { type: string, enum: [unknown] }
                          stockUrgency: { type: string, enum: [normal, high] }
                          averagePrice: { type: integer }
                          sampleSize: { type: integer }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/products/ask:
    post:
      tags: [AI]
      summary: Tanya-jawab tentang satu produk
      description: >-
        Menjawab pertanyaan bebas tentang sebuah produk DARI DATA YANG ADA di
        database: atribut produk, harga, stok, dan penjualnya. Tanpa model
        bahasa, jadi tidak ada jawaban karangan.


        Pertanyaan yang tidak punya sumber jawaban dibalas `answerable: false`
        beserta `askable`: daftar hal yang memang bisa ditanyakan untuk produk
        itu. Ini termasuk saat atributnya belum diisi penjual, yang dibedakan
        pesannya dari pertanyaan di luar cakupan.


        Kosakata pertanyaan memakai ATTRIBUTE_KEYWORDS yang sama dengan need
        interpreter, jadi "ramnya berapa" dan "butuh ram 16gb" merujuk atribut
        yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, question]
              properties:
                productId: { type: string, format: uuid }
                question:
                  type: string
                  minLength: 1
                  maxLength: 300
                  example: "ramnya berapa?"
      responses:
        "200":
          description: Jawaban, atau penjelasan kenapa tidak bisa dijawab
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      productId: { type: string, format: uuid }
                      productName: { type: string }
                      question: { type: string }
                      answerable: { type: boolean }
                      answer:
                        type: string
                        nullable: true
                        example: "ram Asus Vivobook 14 A1404VA: 8 GB."
                      source:
                        type: string
                        description: Asal jawaban - price, stock, seller, atau nama atribut
                      reason:
                        type: string
                        description: Hanya ada saat answerable false
                      askable:
                        type: array
                        items: { type: string }
                        description: Hal yang bisa ditanyakan untuk produk ini
        "404":
          description: Produk tidak ditemukan
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/products/audit:
    post:
      tags: [AI]
      summary: Audit kualitas data produk seller
      description: >-
        Menilai kualitas listing produk: kelengkapan dan keabsahan spesifikasi,
        relevansi spek terhadap kategori, kewajaran harga, konsistensi merek
        antara nama dan deskripsi, serta kualitas deskripsi. Mengembalikan skor
        0-100, grade, daftar masalah ber-severity, dan poin baik.


        Nama atribut boleh `key`, `attr_key`, atau `attrKey`, ketiganya
        dibaca. Nilai boleh `value`, `attr_value`, atau `attrValue`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product:
                  type: object
                  properties:
                    name: { type: string, maxLength: 300 }
                    description: { type: string, maxLength: 10000 }
                    sku: { type: string, maxLength: 100 }
                    category: { type: string, maxLength: 160 }
                    category_name: { type: string, maxLength: 160 }
                    price:
                      nullable: true
                      oneOf:
                        - { type: number }
                        - { type: string }
                    attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          attr_key: { type: string, example: RAM }
                          attr_value: { type: string, example: "16 GB" }
      responses:
        "200":
          description: Hasil audit kualitas data produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      audit:
                        type: object
                        properties:
                          score: { type: integer, minimum: 0, maximum: 100 }
                          grade: { type: string, enum: [EXCELLENT, GOOD, FAIR, POOR] }
                          gradeMessage: { type: string }
                          summary: { type: string }
                          categoryDetected: { type: string, nullable: true }
                          strengths: { type: array, items: { type: string } }
                          issues:
                            type: array
                            items:
                              type: object
                              properties:
                                severity: { type: string, enum: [critical, warning, info] }
                                code:
                                  type: string
                                  example: MISSING_SPEC
                                  description: >-
                                    MISSING_NAME, NAME_TOO_SHORT, NAME_TOO_LONG,
                                    MISSING_DESCRIPTION, EMPTY_TEXT, EMOJI_ONLY,
                                    PLACEHOLDER_TEXT, REPEATED_CHARS, GIBBERISH_TEXT,
                                    TEXT_TOO_SHORT, TEXT_TOO_LONG, ALL_CAPS,
                                    BRAND_CONFLICT, DUPLICATE_ATTRIBUTE, ABSURD_SPEC,
                                    SUSPICIOUS_SPEC, IRRELEVANT_SPEC, MISSING_SPEC,
                                    INVALID_PRICE, SUSPICIOUS_PRICE, MISSING_SKU
                                field: { type: string }
                                message: { type: string }
                                suggestion: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ai/products/check:
    post:
      tags: [AI]
      summary: Cek kecocokan satu produk terhadap kebutuhan
      description: >-
        Membandingkan requirement dan preferensi dengan atribut produk memakai
        predikat yang SAMA dengan matching engine, supaya jawaban di halaman
        detail produk tidak pernah bertentangan dengan daftar rekomendasi.


        Perbandingan angka sadar satuan: produk "2 TB" memenuhi requirement
        "512 GB", dan "2 tahun" memenuhi "12 bulan". Satuan yang tidak sebanding
        (mis. mAh vs jam) jatuh ke perbandingan teks. Nilai teks butuh kecocokan
        persis, bukan substring.


        Hard requirement yang tidak terpenuhi memaksa verdict MISMATCH berapa
        pun skornya. Preferensi tidak pernah mengubah verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product:
                  type: object
                  properties:
                    name: { type: string, maxLength: 300 }
                    attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          attr_key: { type: string }
                          attr_value: { type: string }
                requirements:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value: { type: string }
                      is_hard_requirement: { type: boolean }
                preferences:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: Hasil cek kecocokan produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      check:
                        type: object
                        properties:
                          productName: { type: string }
                          verdict: { type: string, enum: [MATCH, PARTIAL, MISMATCH] }
                          score: { type: integer, minimum: 0, maximum: 100 }
                          hardRequirementsTotal: { type: integer }
                          hardRequirementsMet: { type: boolean, nullable: true }
                          matched:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                required: { type: string }
                                actual: { type: string }
                          missed:
                            type: array
                            items:
                              type: object
                              properties:
                                key: { type: string }
                                required: { type: string }
                                reason: { type: string }
                                actual: { type: array, items: { type: string } }
                          preferencesMatched: { type: integer }
                          preferencesMissed: { type: array, items: { type: object } }
                          summary: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /analytics/shop/conversion:
    get:
      tags: [Analytics]
      summary: "Shop Analytics: Conversion Rate toko sendiri"
      description: |
        Konversi = order dibayar ÷ kunjungan produk, dibatasi ke toko milik user
        yang login.

        Berbeda dari endpoint `/analytics/*` lain di bawah, yang menganalisis
        kebutuhan SELURUH platform dan tidak terikat toko mana pun.

        `changePoint` adalah selisih **poin persen**, bukan pertumbuhan relatif:
        konversi sudah berupa persen, jadi menyebut "naik 50%" untuk perubahan
        2% → 3% menyesatkan; yang benar "naik 1 poin".
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, year], default: month }
        - { name: startDate, in: query, schema: { type: string } }
        - { name: endDate, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tingkat konversi toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      period: { type: string, example: month }
                      views: { type: integer, example: 480 }
                      orders: { type: integer, example: 17 }
                      conversionRate: { type: number, example: 3.54 }
                      previous:
                        type: object
                        properties:
                          views: { type: integer, example: 400 }
                          orders: { type: integer, example: 12 }
                          conversionRate: { type: number, example: 3 }
                      changePoint: { type: number, example: 0.54 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/shop/top-products:
    get:
      tags: [Analytics]
      summary: "Shop Analytics: Top Selling Products toko sendiri"
      description: |
        Diurutkan dari kuantitas terjual terbanyak pada rentang waktu terpilih.

        Dihitung dari `order_items` yang benar-benar terjadi di periode itu,
        BUKAN dari kolom `products.soldCount`, kolom itu kumulatif sejak awal
        dan tidak bisa dipotong per rentang waktu.

        `productName` berisi `(produk dihapus)` bila produknya sudah tidak ada.
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, year], default: month }
        - { name: startDate, in: query, schema: { type: string } }
        - { name: endDate, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Produk terlaris toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer, example: 1 }
                        productId: { type: string, format: uuid }
                        productName: { type: string, example: Mechanical Keyboard }
                        slug: { type: string, nullable: true }
                        stock: { type: integer, example: 24 }
                        isActive: { type: boolean, example: true }
                        quantitySold: { type: integer, example: 31 }
                        revenue: { type: number, example: 4650000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/shop/insights:
    get:
      tags: [Analytics]
      summary: "Shop Analytics: Insight toko (berbasis aturan, bukan LLM)"
      description: |
        Observasi otomatis tentang toko sendiri.

        **Deterministik, tidak memanggil LLM.** Aturannya ada di
        `src/lib/shopInsights.ts` sebagai fungsi murni dengan unit test, sama
        seperti seluruh modul "AI" di proyek ini. Setiap kalimat yang keluar
        selalu bisa ditelusuri ke angka toko yang nyata, kalau datanya tidak
        ada (misalnya periode sebelumnya kosong), perbandingannya tidak
        dikeluarkan sama sekali, bukan dikarang.

        Diurutkan berdasarkan urgensi (`critical` → `warning` → `positive` →
        `info`) dan dipotong maksimal 4 butir.
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, year], default: month }
        - { name: startDate, in: query, schema: { type: string } }
        - { name: endDate, in: query, schema: { type: string } }
      responses:
        "200":
          description: Insight toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      period: { type: string, example: month }
                      insights:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                [
                                  NO_ACTIVE_PRODUCTS,
                                  NO_TRAFFIC,
                                  RESTOCK_BESTSELLER,
                                  OUT_OF_STOCK,
                                  CONVERSION_UP,
                                  CONVERSION_DOWN,
                                  LOW_CONVERSION,
                                  UNVIEWED_PRODUCTS,
                                  REVENUE_UP,
                                  REVENUE_DOWN,
                                  PROMOTE_BESTSELLER,
                                  STEADY,
                                ]
                            severity:
                              type: string
                              enum: [critical, warning, positive, info]
                            message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

