openapi: 3.0.3
info:
  title: NeedBuy Backend API
  version: 1.0.0
  description: |
    API marketplace berbasis kebutuhan (need-based).

    Alur inti: `Need -> Analyze -> Requirements -> Match -> Rank -> Shopping Plan -> Cart -> Checkout -> Order`.

    Dokumen ini menggambarkan API yang BENAR-BENAR ada. Tidak ada endpoint
    imajiner di sini. Ada test otomatis (`src/app/contract.test.ts`) yang gagal
    kalau route dan dokumen ini tidak sinkron.

    **Envelope response** seragam:
    - sukses: `{ "success": true, "data": ..., "meta": {...} }`
    - gagal:  `{ "success": false, "error": { "code": "...", "message": "..." } }`

    **Pembayaran** memakai Midtrans Snap SANDBOX. Server menolak boot kalau
    kredensial bukan sandbox.

    **WebSocket notifikasi** (bukan HTTP, jadi tidak muncul di daftar `paths`):

    ```
    ws(s)://<host>/ws/notifications?token=<accessToken>
    ```

    Token dikirim lewat query karena WebSocket API di browser tidak bisa
    mengirim header `Authorization`. Origin diperiksa terhadap
    `ALLOWED_ORIGINS` saat handshake. Server mengirim frame JSON:

    - `{ "event": "unread-count", "data": { "unreadCount": 3 } }`: dikirim
      saat connect dan setiap kali jumlah belum dibaca berubah.
    - `{ "event": "notification", "data": { ...seperti item GET /notifications } }`
      dikirim saat ada orderan masuk.

servers:
  - url: http://localhost:4000/api/v1
    description: Lokal (di-override dari API_BASE_URL saat runtime)

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Sellers
  - name: Products
  - name: Inventory
  - name: Dashboard
  - name: Addresses
  - name: Saved Products
  - name: Needs
  - name: Shopping Plans
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Payments
  - name: NeedPay
  - name: Admin
  - name: AI
  - name: Analytics
  - name: Coupons
  - name: Messages
  - name: Uploads
    description: |
      Unggah gambar. Body-nya berkas mentah, **bukan multipart**, untuk satu
      berkas per request, `express.raw()` bawaan Express sudah cukup sehingga
      proyek ini tidak perlu dependency parser tambahan.

      Byte-nya disimpan di tabel `uploads` di Postgres, **bukan di disk**:
      direktori di disk tidak ikut backup dan hilang di platform deploy
      berfilesystem sementara. Berkas disajikan di `GET /uploads/{id}`
      di luar `/api/v1` karena itu aset yang dimuat tag `<img>`, bukan endpoint
      API (kalau ikut `/api/v1`, satu halaman penuh gambar akan menghabiskan
      jatah rate limit).
  - name: Notifications
    description: |
      Bel notifikasi di header seller. Realtime lewat WebSocket
      `/ws/notifications`; endpoint HTTP di bawah dipakai untuk muat awal dan
      sebagai fallback kalau socket putus.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kunci unik per operasi. Request ulang dengan kunci dan body yang sama
        akan memutar ulang response tersimpan, bukan menjalankan ulang operasi.
      schema: { type: string, maxLength: 200 }

  schemas:
    Money:
      type: string
      description: Nilai uang sebagai string desimal. JANGAN diparsing sebagai float.
      example: "12000000.00"

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: RESOURCE_NOT_FOUND }
            message: { type: string, example: Produk tidak ditemukan }
            fields:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
        requestId: { type: string }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        avatarUrl:
          type: string
          nullable: true
          description: |
            URL foto profil, hasil `POST /uploads/image`. Selalu ikut terkirim
            ke lawan bicara di chat, foto profil bersifat publik.
        role: { type: string, enum: [BUYER, SELLER, ADMIN] }
        authProvider: { type: string, enum: [LOCAL, GOOGLE] }
        createdAt: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, example: 15m }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        parentId: { type: string, format: uuid, nullable: true }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    Seller:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeName: { type: string }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        address: { type: string, nullable: true }
        vacationMode: { type: boolean }
        rating: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        price: { $ref: "#/components/schemas/Money" }
        stock: { type: integer }
        rating: { $ref: "#/components/schemas/Money" }
        soldCount: { type: integer }
        discountPercent:
          type: integer
          minimum: 0
          maximum: 90
          description: 0 = tidak promo. Harga coret dihitung client dari `price` dan nilai ini.
        bulkMinQty:
          type: integer
          nullable: true
          minimum: 2
          description: |
            Diskon grosir: jumlah minimal beli agar `bulkDiscountPercent`
            berlaku. `null` (bersama `bulkDiscountPercent`) = tidak ada
            penawaran grosir. Potongannya dihitung server (`lib/bulkPrice.ts`)
            saat menyusun subtotal cart dan checkout, client tidak boleh
            menghitung harga bayar sendiri.
        bulkDiscountPercent:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
          description: Potongan grosir dalam persen. Selalu terisi/kosong berpasangan dengan `bulkMinQty`.
        condition:
          type: string
          description: |
            Hanya pada response list. Diratakan dari atribut produk `kondisi`;
            produk tanpa atribut itu dikembalikan sebagai `Baru`.
          enum: [Baru, "Seperti Baru", Refurbished]
        isActive: { type: boolean }
        category: { $ref: "#/components/schemas/Category" }
        seller: { $ref: "#/components/schemas/Seller" }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              isPrimary: { type: boolean }
              sortOrder: { type: integer }
        attributes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              attrKey: { type: string }
              attrValue: { type: string }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, nullable: true }
        recipientName: { type: string }
        phone: { type: string }
        fullAddress: { type: string }
        city: { type: string }
        province: { type: string }
        postalCode: { type: string }
        isDefault: { type: boolean }

    Need:
      type: object
      properties:
        id: { type: string, format: uuid }
        rawInput: { type: string }
        goal: { type: string, nullable: true }
        budget: { $ref: "#/components/schemas/Money" }
        location: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PROCESSING, COMPLETED] }

    NeedClarification:
      type: object
      description: >-
        Satu giliran dialog klarifikasi. `answer` dan `answeredAt` null selama
        pertanyaannya belum dijawab.
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, description: "Urutan giliran, 1-based" }
        field:
          type: string
          enum: [budget, category, goal, requirement]
          description: Bagian kebutuhan yang ditanyakan
        question: { type: string }
        context: { type: string, nullable: true }
        answer: { type: string, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ParsedNeed:
      type: object
      description: Hasil interpreter. BELUM dipersist sampai dikonfirmasi user.
      properties:
        goal: { type: string, nullable: true }
        budget: { type: number, nullable: true }
        location: { type: string, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        categorySlug: { type: string, nullable: true }
        requirements:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
              isHard:
                type: boolean
                description: true = wajib. Produk yang tidak memenuhinya langsung gugur.
        preferences:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
              weight: { type: number }
        needsClarification: { type: boolean }
        clarificationQuestions:
          type: array
          items: { type: string }
        source: { type: string, enum: [RULE_BASED, LLM] }

    Recommendation:
      type: object
      description: Seluruh skor dihitung backend. Client tidak pernah otoritatif.
      properties:
        id: { type: string, format: uuid }
        matchScore: { $ref: "#/components/schemas/Money" }
        categoryScore: { $ref: "#/components/schemas/Money" }
        budgetScore: { $ref: "#/components/schemas/Money" }
        requirementScore: { $ref: "#/components/schemas/Money" }
        preferenceScore: { $ref: "#/components/schemas/Money" }
        qualityScore: { $ref: "#/components/schemas/Money" }
        sellerScore: { $ref: "#/components/schemas/Money" }
        label: { type: string, enum: [BEST_MATCH, GOOD_MATCH, ALTERNATIVE] }
        ranking: { type: integer }
        explanation: { type: string, nullable: true }
        product: { $ref: "#/components/schemas/Product" }

    ShoppingPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        needId: { type: string, format: uuid, nullable: true }
        budget: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [DRAFT, READY, NEEDS_ADJUSTMENT] }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              quantity: { type: integer }
              priceAtAdd: { $ref: "#/components/schemas/Money" }
              subtotal: { $ref: "#/components/schemas/Money" }
              isReplaced: { type: boolean }
              product: { $ref: "#/components/schemas/Product" }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        budget: { $ref: "#/components/schemas/Money", nullable: true }
        subtotal: { $ref: "#/components/schemas/Money" }
        itemCount: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              quantity: { type: integer }
              priceAtAdd: { $ref: "#/components/schemas/Money" }
              subtotal: { $ref: "#/components/schemas/Money" }
              isReplaced: { type: boolean }
              product: { $ref: "#/components/schemas/Product" }
        budgetCheck:
          type: object
          nullable: true
          properties:
            overBudget: { type: boolean }
            remaining: { $ref: "#/components/schemas/Money" }
            budgetPercentage: { type: number, example: 75.5 }
        unavailableItems:
          type: array
          items:
            type: object
            properties:
              cartItemId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              requested: { type: integer }
              available: { type: integer }

    Order:
      type: object
      description: Satu order = satu seller. Cart multi-seller menghasilkan beberapa order.
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: NB-1786000000000-A1B2C3 }
        status:
          type: string
          enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        subtotal: { $ref: "#/components/schemas/Money" }
        shippingCost: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        seller: { $ref: "#/components/schemas/Seller" }
        address: { $ref: "#/components/schemas/Address" }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              productName:
                type: string
                description: Snapshot saat order dibuat. Tidak ikut berubah kalau produk di-rename.
              quantity: { type: integer }
              price: { $ref: "#/components/schemas/Money" }
              subtotal: { $ref: "#/components/schemas/Money" }
        payment: { $ref: "#/components/schemas/Payment" }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
        method: { type: string, nullable: true }
        snapToken: { type: string, nullable: true }
        snapRedirectUrl: { type: string, nullable: true }
        midtransOrderId: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        media:
          type: array
          description: Foto/video yang dilampirkan pembeli, urut sesuai `sortOrder`.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              url: { type: string, format: uri }
              kind: { type: string, enum: [IMAGE, VIDEO] }
        orderItem:
          type: object
          nullable: true
          description: |
            Hanya pada daftar review produk. Membawa `variant` yang dibeli
            bintang 3 pada model termurah beda artinya dengan bintang 3 pada
            model termahal.
          properties:
            variant: { type: string, nullable: true }

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Belum terautentikasi atau token tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Terautentikasi tapi tidak berhak atas resource ini
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Bentrok state (stok kurang, transisi status ilegal, duplikat)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Validasi input gagal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Melebihi rate limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru
      description: |
        Membuat user baru beserta cart-nya. Role selalu BUYER, tidak ada
        pilihan role di sini. Untuk jadi penjual, user mendaftarkan tokonya
        lewat POST /sellers dari halaman profil (butuh nama perusahaan,
        alamat, dan telepon).
        Field confirmPassword harus sama dengan password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, confirmPassword]
              additionalProperties: false
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: "^[a-zA-Z0-9_]+$"
                  description: Username unik, hanya huruf, angka, dan underscore
                email:
                  type: string
                  format: email
                  description: Work email address
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                confirmPassword:
                  type: string
                  description: Harus sama dengan field password
      responses:
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/TokenPair" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/social:
    post:
      tags: [Auth]
      summary: Login atau daftar via Google (Direct ID Token)
      description: |
        Autentikasi menggunakan akun Google via ID token. Jika user belum terdaftar,
        akun baru akan dibuat secara otomatis. idToken harus berupa JWT yang valid
        dari Google dan akan diverifikasi ke Google.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum: [GOOGLE]
                  description: Provider OAuth
                idToken:
                  type: string
                  description: ID token JWT dari provider
      responses:
        "200":
          description: Berhasil login/daftar via social auth
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google:
    get:
      tags: [Auth]
      summary: Inisiasi Google OAuth 2.0 Login (Redirect Flow)
      description: |
        Mengarahkan browser user ke Google OAuth Consent Screen.
        Backend akan men-generate CSRF state dan me-redirect langsung (HTTP 302) ke Google.
      security: []
      responses:
        "302":
          description: Redirect ke Google OAuth consent screen
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback Google OAuth 2.0
      description: |
        Menerima authorization code dan CSRF state dari Google setelah user menyetujui login.
        Backend menukar authorization code dengan Google ID token, memverifikasi identitas Google,
        membuat atau mencari user NeedBuy, lalu me-redirect browser ke FRONTEND_URL/auth/callback
        membawa accessToken dan refreshToken di query string.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: Authorization code dari Google
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: CSRF protection state
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: Pesan error dari Google jika user menolak login
      responses:
        "302":
          description: Redirect ke FRONTEND_URL/auth/callback
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Pesan error identik untuk email tidak dikenal maupun password salah,
        supaya endpoint ini tidak bisa dipakai mengenumerasi akun.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Berhasil login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotasi refresh token
      description: |
        Token lama dicabut dan diganti yang baru. Memakai token yang sudah
        dicabut dianggap indikasi kebocoran: SELURUH sesi user itu dicabut.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Pasangan token baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Token dicabut

  /auth/verify-email/{token}:
    post:
      tags: [Auth]
      summary: Verifikasi alamat email
      description: >-
        Token sekali pakai, berlaku 24 jam. Berhasil = user langsung dilogin
        (access + refresh token dikembalikan), karena dia baru saja membuktikan
        menguasai kotak masuknya. Token asing, kedaluwarsa, dan sudah terpakai
        dibalas pesan yang sama supaya tidak bisa dipakai menebak.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
        "200":
          description: Email terverifikasi, sesi baru diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { type: object }
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      expiresIn: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Kirim ulang email verifikasi
      description: >-
        Alamat tujuan diambil dari akun yang login, bukan dari body, endpoint
        ini tidak bisa dipakai mengirim email ke alamat orang lain. Maksimal
        3 kali per jam per akun.
      responses:
        "200":
          description: Email dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      sent: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Minta tautan atur ulang password
      description: >-
        SELALU membalas 200, termasuk untuk email yang tidak terdaftar dan akun
        Google yang tidak punya password. Balasan yang berbeda akan mengubah
        endpoint ini jadi alat pengecek keberadaan akun.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Kalau akunnya ada, email sudah dikirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      sent: { type: boolean }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/validate-reset-token/{token}:
    post:
      tags: [Auth]
      summary: Cek tautan reset sebelum form ditampilkan
      description: Tidak menghanguskan token, cuma memberi tahu masih berlaku atau tidak.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
        "200":
          description: Status tautan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Atur ulang password pakai tautan
      description: >-
        Token berlaku 1 jam dan sekali pakai. Setelah berhasil, SEMUA refresh
        token milik user dicabut: reset password harus benar-benar mengusir
        pembajak, bukan cuma mengganti kunci depan.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
                confirmPassword: { type: string }
      responses:
        "200":
          description: Password diganti, semua sesi dicabut
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      reset: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil user saat ini
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      tags: [Users]
      summary: Profil lengkap user saat ini
      description: |
        Lebih kaya dari `GET /auth/me`: menyertakan profil toko (kalau ada) dan
        ringkasan jumlah order, need, serta alamat. `GET /auth/me` tetap ada
        sebagai payload sesi yang ringan untuk dipanggil setelah login.
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          seller:
                            nullable: true
                            allOf: [{ $ref: "#/components/schemas/Seller" }]
                          _count:
                            type: object
                            properties:
                              orders: { type: integer }
                              needs: { type: integer }
                              addresses: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Ubah profil sendiri
      description: |
        Hanya `name`, `phone`, dan `avatarUrl`. `avatarUrl` diisi URL hasil
        `POST /uploads/image` (kirim `null` untuk menghapus foto), endpoint ini
        tidak menerima berkas. Yang sengaja TIDAK bisa diubah di sini:

        - `role`, kalau bisa dikirim dari body, ini jalur eskalasi hak akses langsung
        - `email`: identitas login, penggantiannya butuh alur verifikasi email
        - `passwordHash`: hanya lewat change-password, dengan bukti password lama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone: { type: string, nullable: true }
                avatarUrl: { type: string, format: uri, maxLength: 500, nullable: true }
      responses:
        "200":
          description: Profil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Ganti password
      description: |
        Butuh bukti password saat ini. Password baru harus berbeda.

        Berhasil mengganti password akan **mencabut seluruh refresh token** user
        ini. Alasannya justru kasus terpenting: orang mengganti password karena
        curiga akunnya diambil orang lain. Kalau sesi lama tetap hidup, penyerang
        masih bisa me-refresh token dan penggantian password tidak menyelesaikan
        apa pun. Setelah ini semua perangkat **lain** harus login ulang.

        Perangkat yang melakukan penggantian menerima sesi baru di response
        (`accessToken` + `refreshToken`) dan **wajib menyimpannya**, token
        lamanya ikut tercabut, jadi tanpa penggantian ini sesinya mati sendiri
        begitu access token lama kedaluwarsa. Ini tidak melemahkan pencabutan:
        yang tersisa hanya perangkat yang barusan membuktikan tahu password lama.

        Memakai rate limiter kredensial (10 per 15 menit per IP), bukan limiter
        tulis biasa, karena endpoint ini memverifikasi password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string, maxLength: 128 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password diganti, sesi lain dicabut, sesi ini diterbitkan ulang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      changed: { type: boolean }
                      revokedSessions: { type: integer }
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      expiresIn: { type: string, example: 15m }
                      message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Password saat ini salah (`INVALID_CURRENT_PASSWORD`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /categories:
    get:
      tags: [Categories]
      summary: Pohon kategori
      security: []
      responses:
        "200":
          description: Daftar kategori root beserta anaknya
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

    post:
      tags: [Categories]
      summary: Buat kategori (ADMIN)
      description: |
        `slug` opsional, kalau dikosongkan, diturunkan dari `name`.
        Slug wajib unik dan hanya boleh huruf kecil, angka, dan tanda hubung
        karena masuk ke URL publik.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 160 }
                description: { type: string, maxLength: 500, nullable: true }
                isActive:
                  type: boolean
                  description: Kategori nonaktif disembunyikan dari pohon kategori publik.
                parentId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Kategori dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Kategori induk tidak ditemukan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Slug sudah dipakai (`CATEGORY_SLUG_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /categories/admin/all:
    get:
      tags: [Categories]
      summary: Daftar rata semua kategori (ADMIN)
      description: |
        Daftar rata (bukan pohon) untuk panel admin, lengkap dengan jumlah
        produk dan sub-kategori per baris. Kategori nonaktif ikut ditampilkan
        justru itu yang perlu dilihat admin. Tanpa pagination: jumlah kategori
        dibatasi struktur katalog, bukan pertumbuhan data.
      responses:
        "200":
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Category"
                        - type: object
                          properties:
                            _count:
                              type: object
                              properties:
                                products: { type: integer }
                                children: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Detail kategori
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detail kategori
        "404": { $ref: "#/components/responses/NotFound" }

  /categories/{id}:
    patch:
      tags: [Categories]
      summary: Ubah kategori (ADMIN)
      description: |
        Mengubah `parentId` divalidasi terhadap siklus. Menjadikan kategori
        sebagai keturunan dirinya sendiri akan membuat cabang itu hilang diam-diam
        dari pohon kategori (node-nya tidak pernah sampai ke root) dan penelusuran
        induk berputar selamanya. Postgres tidak mencegahnya, relasinya sah
        secara foreign key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 160 }
                description: { type: string, maxLength: 500, nullable: true }
                isActive:
                  type: boolean
                  description: Kategori nonaktif disembunyikan dari pohon kategori publik.
                parentId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Kategori diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Slug sudah dipakai, atau perubahan membuat siklus (`CATEGORY_CYCLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Categories]
      summary: Hapus kategori (ADMIN)
      description: |
        Ditolak kalau kategori masih dipakai produk atau masih punya
        sub-kategori. Tanpa pengecekan ini Postgres menolak dengan error foreign
        key yang tidak bisa dijelaskan ke user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Kategori dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Masih dipakai produk (`CATEGORY_HAS_PRODUCTS`) atau punya anak (`CATEGORY_HAS_CHILDREN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /sellers:
    post:
      tags: [Sellers]
      summary: Daftarkan toko
      description: |
        Satu-satunya jalur menjadi penjual. Form register TIDAK lagi punya
        pilihan role: semua akun mulai sebagai BUYER, lalu mendaftarkan toko
        dari halaman profil lewat endpoint ini.

        Role user ikut naik jadi SELLER dalam transaction yang sama: baris
        `sellers` tanpa role SELLER (atau sebaliknya) adalah state yang tidak
        boleh pernah ada.

        `storeName` (nama perusahaan), `address`, dan `phone` wajib. Sisanya
        opsional dan bisa dilengkapi belakangan di Seller Settings. `logoUrl`
        berisi URL: unggah berkasnya dulu lewat `POST /uploads/image`, lalu
        kirim URL hasilnya di sini.

        `rating` dan `status` tidak bisa dititipkan lewat body (ditolak
        `additionalProperties: false`), keduanya dikendalikan server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName, address, phone]
              additionalProperties: false
              properties:
                storeName:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Nama perusahaan/toko
                address: { type: string, minLength: 10, maxLength: 500 }
                phone:
                  type: string
                  minLength: 8
                  maxLength: 20
                  pattern: '^[0-9+\-\s()]+$'
                description: { type: string, maxLength: 2000, nullable: true }
                logoUrl: { type: string, format: uri, maxLength: 2000, nullable: true }
                businessEmail: { type: string, format: email, maxLength: 255, nullable: true }
      responses:
        "201":
          description: Toko dibuat
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

    get:
      tags: [Sellers]
      summary: Cari toko (nama atau deskripsi)
      description: |
        Dipakai halaman pencarian pembeli. Pencarian produk (`GET /products?q=`)
        hanya mencocokkan nama dan deskripsi PRODUK, jadi tanpa endpoint ini
        mencari nama toko tidak menghasilkan apa pun.

        Toko `SUSPENDED` tidak pernah muncul, itu tindakan moderasi, jadi
        tokonya memang tidak boleh ditemukan. Toko yang sedang libur tetap
        muncul, dengan `vacationMode: true` supaya UI bisa menandainya.

        Diurutkan rating tertinggi lebih dulu, nama toko sebagai pemecah seri
        agar urutannya stabil antar-halaman.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Daftar toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        storeName: { type: string, example: Tech Hub Store }
                        description: { type: string, nullable: true }
                        logoUrl: { type: string, nullable: true }
                        address: { type: string, nullable: true }
                        vacationMode: { type: boolean, example: false }
                        rating: { type: string, example: "4.80" }
                        status: { type: string, enum: [ACTIVE] }
                        createdAt: { type: string, format: date-time }
                        _count:
                          type: object
                          properties:
                            products: { type: integer, example: 11 }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /sellers/me:
    get:
      tags: [Sellers]
      summary: Setelan toko sendiri (Seller Settings)
      description: |
        Berbeda dari `GET /sellers/{id}` yang publik, respons ini ikut membawa
        `businessEmail` dan `phone`, kontak internal yang tidak dibuka untuk
        pengunjung halaman toko. `address` sendiri ikut terbuka di endpoint
        publik karena itu bagian dari profil toko.
      responses:
        "200":
          description: Setelan toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      storeName: { type: string, example: Tech Hub Store }
                      description: { type: string, nullable: true }
                      logoUrl: { type: string, nullable: true }
                      address: { type: string, nullable: true }
                      businessEmail: { type: string, nullable: true }
                      phone: { type: string, nullable: true }
                      vacationMode: { type: boolean, example: false }
                      rating: { type: string, example: "4.80" }
                      status: { type: string, enum: [ACTIVE, SUSPENDED] }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      _count:
                        type: object
                        properties:
                          products: { type: integer, example: 11 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Sellers]
      summary: Ubah setelan toko sendiri
      description: |
        Minimal satu field harus dikirim.

        `rating` dan `status` TIDAK bisa diubah lewat sini, keduanya
        dikendalikan server/admin.

        **`vacationMode` bukan `status`.** `SUSPENDED` adalah tindakan moderasi
        admin; kalau libur memakai kolom yang sama, penjual bisa mencabut
        suspensinya sendiri. Saat `vacationMode` aktif, toko menolak pesanan
        baru di `POST /cart/items` dan `POST /checkout` dengan kode
        `SELLER_ON_VACATION`; produknya tetap bisa dilihat.

        `logoUrl` menerima URL, bukan berkas, proyek ini tidak punya jalur
        upload file (gambar produk pun memakai URL).

        Kirim string kosong `""` atau `null` pada `description`, `address`,
        `phone`, `logoUrl`, atau `businessEmail` untuk mengosongkannya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                storeName: { type: string, minLength: 3, maxLength: 120 }
                description: { type: string, maxLength: 2000, nullable: true }
                address: { type: string, maxLength: 500, nullable: true }
                phone: { type: string, maxLength: 20, nullable: true }
                logoUrl: { type: string, format: uri, maxLength: 2000, nullable: true }
                businessEmail: { type: string, format: email, maxLength: 255, nullable: true }
                vacationMode: { type: boolean }
      responses:
        "200":
          description: Toko diperbarui
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sellers/me/orders:
    get:
      tags: [Sellers]
      summary: Order yang masuk ke toko sendiri
      description: |
        Hanya order dengan `sellerId` milik pemanggil, `sellerId` ikut di klausa
        `where`, bukan dicek setelah data diambil.

        Berbeda dari tampilan pembeli: menyertakan nama pembeli, tapi **tidak**
        menyertakan `snapToken` / `snapRedirectUrl`. Token pembayaran itu milik
        pembeli; seller hanya perlu tahu status pembayarannya.

        Dipakai bersama `PATCH /orders/{id}/status` untuk menandai `SHIPPED` dan
        `DELIVERED`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        - name: q
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar order toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        orderNumber: { type: string }
                        status: { type: string }
                        subtotal: { $ref: "#/components/schemas/Money" }
                        shippingCost: { $ref: "#/components/schemas/Money" }
                        total: { $ref: "#/components/schemas/Money" }
                        user:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                        address: { $ref: "#/components/schemas/Address" }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              productId: { type: string, format: uuid }
                              productName: { type: string }
                              quantity: { type: integer }
                              price: { $ref: "#/components/schemas/Money" }
                              subtotal: { $ref: "#/components/schemas/Money" }
                        payment:
                          type: object
                          properties:
                            status: { type: string }
                            method: { type: string, nullable: true }
                            paidAt: { type: string, format: date-time, nullable: true }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Akun belum punya toko, atau toko disuspend (`SELLER_SUSPENDED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /sellers/me/orders/export:
    get:
      tags: [Sellers]
      summary: Export order toko dalam format CSV
      description: Mengunduh data daftar order toko seller dalam format CSV dengan filter pencarian dan status.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_PAYMENT, PROCESSING, SHIPPED, DELIVERED, COMPLETED, CANCELLED]
        - name: q
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: File CSV order toko
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /sellers/me/orders/{id}:
    get:
      tags: [Sellers]
      summary: Detail satu order toko sendiri
      description: Order milik toko lain menghasilkan 404, bukan 403, keberadaannya tidak diungkap.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail order
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Akun belum punya toko, atau toko disuspend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sellers/{id}/follow:
    post:
      tags: [Sellers]
      summary: Ikuti toko
      description: |
        Dipakai tombol "Ikuti" di kartu profil penjual pada halaman produk.

        Idempoten: unique `(user_id, seller_id)` di `seller_follows` yang
        menjaganya, jadi menekan tombol dua kali tidak menghasilkan baris ganda
        dan tidak butuh cek-lalu-insert yang bisa balapan.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Status ikut terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      sellerId: { type: string, format: uuid }
                      following: { type: boolean, example: true }
                      followerCount: { type: integer, example: 128 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Sellers]
      summary: Berhenti mengikuti toko
      description: "Idempoten, memanggilnya untuk toko yang belum diikuti tetap `200`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Status ikut terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      sellerId: { type: string, format: uuid }
                      following: { type: boolean, example: false }
                      followerCount: { type: integer, example: 127 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sellers/{id}:
    get:
      tags: [Sellers]
      summary: Profil toko publik
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Profil toko
        "404": { $ref: "#/components/responses/NotFound" }

  /products:
    get:
      tags: [Products]
      summary: Pencarian produk tradisional
      description: |
        Ini juga permukaan fallback saat interpreter kebutuhan gagal
        marketplace harus tetap bisa dipakai tanpa AI.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - name: categorySlugs
          in: query
          description: |
            Slug kategori dipisah koma, mis. `dekorasi,furniture`. Turunan tiap
            slug ikut dimekarkan di server karena produk hanya menempel di
            kategori daun: memilih "Rumah Tangga" tetap memunculkan isinya.
            Maksimal 50 slug.
          schema: { type: string, maxLength: 2000 }
        - name: conditions
          in: query
          description: |
            Kondisi barang dipisah koma, mis. `Baru,Refurbished`. Nilai `Baru`
            ikut menangkap produk yang tidak punya atribut `kondisi` sama
            sekali, karena itu memang default-nya. Maksimal 10 nilai.
          schema: { type: string, maxLength: 200 }
        - { name: sellerId, in: query, schema: { type: string, format: uuid } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - name: onSale
          in: query
          description: Kalau true, hanya produk dengan `discountPercent > 0`.
          schema: { type: string, enum: ["true", "false", "1", "0"] }
        - name: sort
          in: query
          description: Dibatasi allowlist; nilai lain ditolak 422.
          schema: { type: string, enum: [newest, price_asc, price_desc, rating, sold], default: newest }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Products]
      summary: Buat produk (seller)
      description: sellerId diambil dari sesi, tidak pernah dari body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, price, stock]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 3, maxLength: 200 }
                categoryId: { type: string, format: uuid }
                description: { type: string, maxLength: 5000 }
                price: { oneOf: [{ type: string }, { type: number }] }
                stock: { type: integer, minimum: 0 }
                attributes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [attrKey, attrValue]
                    properties:
                      attrKey: { type: string }
                      attrValue: { type: string }
                images:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        "201":
          description: Produk dibuat
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /products/category/{slug}:
    get:
      tags: [Products]
      summary: Produk dalam satu kategori
      description: |
        Kategori induk ikut menyertakan produk seluruh sub-kategorinya, karena
        produk hanya menempel di kategori daun.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - name: onSale
          in: query
          schema: { type: string, enum: ["true", "false", "1", "0"] }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc, rating, sold], default: newest }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar produk dalam kategori
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{slug}:
    get:
      tags: [Products]
      summary: Detail produk berdasarkan slug
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Detail produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}:
    patch:
      tags: [Products]
      summary: Ubah produk (pemilik saja)
      description: |
        Seller yang menyentuh produk seller lain dapat 403, bukan 404
        dia seller yang sah, menyembunyikan keberadaan produk tidak berguna.
        `rating`, `soldCount`, dan `sellerId` tidak bisa diubah lewat endpoint ini.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                categoryId: { type: string, format: uuid }
                description: { type: string, nullable: true }
                price: { oneOf: [{ type: string }, { type: number }] }
                stock: { type: integer, minimum: 0 }
                isActive: { type: boolean }
      responses:
        "200":
          description: Produk diperbarui
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Products]
      summary: Nonaktifkan produk (soft delete)
      description: isActive di-set false. Produk tidak dihapus supaya riwayat order tetap utuh.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Produk dinonaktifkan
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}/attributes:
    put:
      tags: [Products]
      summary: Ganti seluruh atribut produk
      description: Atribut inilah yang dicek matching engine untuk hard requirement.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              additionalProperties: false
              properties:
                attributes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [attrKey, attrValue]
                    properties:
                      attrKey: { type: string }
                      attrValue: { type: string }
      responses:
        "200":
          description: Atribut diganti
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Products]
      summary: Tambah satu atribut produk (pemilik saja)
      description: |
        Satu `attrKey` boleh punya beberapa nilai (mis. `warna: merah` dan
        `warna: biru`): matching engine mencocokkan dengan `some()`, jadi
        produk dianggap memenuhi requirement kalau salah satu nilainya cocok.
        Yang ditolak hanya duplikat persis (key dan value sama), karena itu
        murni sampah data.

        `attrKey` dinormalisasi ke huruf kecil agar cocok dengan requirement
        yang juga dinormalisasi.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attrKey, attrValue]
              additionalProperties: false
              properties:
                attrKey: { type: string, minLength: 1, maxLength: 60, example: ram }
                attrValue: { type: string, minLength: 1, maxLength: 200, example: 16GB }
      responses:
        "201":
          description: Atribut ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      attrKey: { type: string }
                      attrValue: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Atribut dengan key dan value yang sama sudah ada (`ATTRIBUTE_DUPLICATE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /products/{id}/images:
    post:
      tags: [Products]
      summary: Tambah gambar produk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              additionalProperties: false
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        "201":
          description: Gambar ditambahkan
        "403": { $ref: "#/components/responses/Forbidden" }

  /products/{id}/images/{imageId}:
    patch:
      tags: [Products]
      summary: Ubah urutan atau tandai gambar utama (pemilik saja)
      description: |
        `isPrimary` bersifat tunggal, menandai satu gambar sebagai utama akan
        melepas tanda itu dari gambar lain milik produk yang sama, dalam satu
        transaction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                isPrimary: { type: boolean }
                sortOrder: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Gambar diperbarui
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Products]
      summary: Hapus satu gambar produk (pemilik saja)
      description: |
        Menghapus gambar utama tidak mempromosikan gambar lain secara otomatis:
        query pembacaan sudah mengurutkan `[isPrimary desc, sortOrder asc]`,
        jadi gambar pertama tetap terpilih secara deterministik.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Gambar dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}/attributes/{attrId}:
    delete:
      tags: [Products]
      summary: Hapus satu atribut produk (pemilik saja)
      description: |
        Menghapus atribut bisa membuat produk gugur dari hard requirement yang
        sebelumnya dipenuhinya. Rekomendasi lama tidak ikut diperbarui sampai
        need-nya diproses ulang.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attrId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Atribut dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}/view:
    post:
      tags: [Products]
      summary: Catat satu kunjungan produk
      description: |
        Dipanggil halaman detail produk. Boleh diakses tanpa login, kunjungan
        guest tetap dihitung, hanya `user_id`-nya null. Kalau header
        `Authorization` dikirim dan valid, pengunjung ikut tercatat sehingga
        bisa dihitung sebagai unique visitor.

        Ini sumber data card `GET /dashboard/product-views`.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Kunjungan tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      recorded: { type: boolean, example: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}/reviews:
    get:
      tags: [Products]
      summary: Review sebuah produk
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /invent:
    get:
      tags: [Inventory]
      summary: Daftar inventori produk milik seller
      description: |
        Mengambil produk inventori toko seller yang sedang login, terpaginasi.

        Tiap baris membawa `category`, seluruh `images`, dan `attributes`
        form edit penjual perlu galeri lengkapnya, kalau hanya thumbnail yang
        dikirim gambar lama seolah hilang setiap kali produk dibuka. Pencarian `q` mencocokkan nama,
        SKU, dan deskripsi (case-insensitive).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE, ALL] } }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, price, stock, createdAt] }
          description: |
            Diurut di server karena tabelnya terpaginasi, mengurut di client
            hanya mengurut baris yang sedang tampil, sehingga header "Harga ↑"
            jadi bohong untuk halaman berikutnya.
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Daftar produk inventori toko
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Inventory]
      summary: Tambah produk inventori baru (Add New Product/Item)
      description: Menambahkan produk inventori baru untuk toko seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, price, stock]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
                sku: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string, maxLength: 5000 }
                categoryId: { type: string, format: uuid }
                price: { type: number, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                isActive: { type: boolean, default: true }
                discountPercent: { type: integer, minimum: 0, maximum: 90 }
                bulkMinQty: { type: integer, minimum: 2, nullable: true }
                bulkDiscountPercent: { type: integer, minimum: 1, maximum: 90, nullable: true }
                images:
                  type: array
                  maxItems: 10
                  description: |
                    URL hasil `POST /uploads/image`, BUKAN berkas multipart.

                    Gambar dibuat bersama produknya dalam satu transaction.
                    Sebelumnya form penjual mengirim multipart ke
                    `POST /invent/{id}/images` yang handler-nya tidak pernah ada
                    itu sebabnya produk buatan penjual tampil tanpa gambar di
                    halaman pembeli. Endpoint terpisah itu sudah dihapus.
                  items:
                    type: object
                    required: [url]
                    additionalProperties: false
                    properties:
                      url: { type: string, format: uri, maxLength: 2000 }
                      isPrimary: { type: boolean, default: false }
                      sortOrder: { type: integer, minimum: 0, maximum: 50 }
                attributes:
                  type: array
                  maxItems: 40
                  description: |
                    Spesifikasi produk. Beberapa baris dengan `attrKey` sama
                    (mis. dua baris `warna`) dibaca halaman produk sebagai
                    pilihan model/varian.
                  items:
                    type: object
                    required: [attrKey, attrValue]
                    additionalProperties: false
                    properties:
                      attrKey: { type: string, minLength: 1, maxLength: 60 }
                      attrValue: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Produk inventori berhasil dibuat
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /invent/stats:
    get:
      tags: [Inventory]
      summary: Hitungan kartu status My Products (Active / Out of Stock / Drafts)
      description: |
        Dihitung di server atas SELURUH produk toko, bukan diturunkan dari satu
        halaman `GET /invent`, kalau dihitung di client, angkanya hanya
        menjumlahkan baris yang sedang tampil dan berubah tiap ganti halaman.

        Definisi status mengikuti yang ditampilkan UI:
        - `drafts`: `isActive` false (belum ditayangkan)
        - `outOfStock`: tayang tapi `stock` 0
        - `active`: tayang dan `stock` > 0
      responses:
        "200":
          description: Hitungan status produk toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 12 }
                      active: { type: integer, example: 9 }
                      outOfStock: { type: integer, example: 2 }
                      drafts: { type: integer, example: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /invent/{id}:
    get:
      tags: [Inventory]
      summary: Detail satu produk inventori milik seller
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Detail produk inventori
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Inventory]
      summary: Update produk inventori milik seller
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 200 }
                sku: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string, maxLength: 5000 }
                categoryId: { type: string, format: uuid }
                price: { type: number, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                isActive: { type: boolean }
                discountPercent: { type: integer, minimum: 0, maximum: 90 }
                bulkMinQty: { type: integer, minimum: 2, nullable: true }
                bulkDiscountPercent: { type: integer, minimum: 1, maximum: 90, nullable: true }
                images:
                  type: array
                  maxItems: 10
                  description: |
                    Ganti-semua: dikirim = daftar lama dihapus lalu ditulis
                    ulang, tidak dikirim = dibiarkan apa adanya. Isinya URL
                    hasil `POST /uploads/image`.
                  items:
                    type: object
                    required: [url]
                    additionalProperties: false
                    properties:
                      url: { type: string, format: uri, maxLength: 2000 }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer, minimum: 0, maximum: 50 }
                attributes:
                  type: array
                  maxItems: 40
                  description: Ganti-semua, sama seperti `images`.
                  items:
                    type: object
                    required: [attrKey, attrValue]
                    additionalProperties: false
                    properties:
                      attrKey: { type: string, minLength: 1, maxLength: 60 }
                      attrValue: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Produk inventori berhasil diperbarui
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Inventory]
      summary: Hapus produk inventori milik seller
      description: |
        Hanya bisa untuk produk yang **belum pernah dipesan**. Kalau sudah ada
        `order_items` yang menunjuk ke produk ini, request ditolak `409`
        dengan kode `PRODUCT_HAS_ORDERS`, menghapusnya akan merusak riwayat
        order pembeli. Jalan keluarnya: set `isActive: false` lewat
        `PATCH /invent/{id}` supaya produk hilang dari toko tapi riwayatnya utuh.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Produk inventori berhasil dihapus
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Produk sudah pernah dipesan (`PRODUCT_HAS_ORDERS`)

