    get:
      tags: [Dashboard]
      summary: "Card 1: Total Sales (pendapatan toko dalam Rupiah)"
      description: |
        Total pendapatan dari seluruh order yang masuk ke toko ini.

        Hanya order berstatus `PROCESSING`, `SHIPPED`, `DELIVERED`, `COMPLETED`
