        bisa berakhir `CANCELLED`.

        `value` adalah total sepanjang waktu (yang ditampilkan di card),
        `periodValue` + `growthPercentage` adalah potongan sesuai `period`
        dibanding periode sebelumnya yang sama panjang.
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, year], default: month }
        - name: startDate
          in: query
          schema: { type: string }
        - name: endDate
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Total penjualan toko
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      period: { type: string, example: month }
                      value: { type: number, example: 1245000 }
                      formatted: { type: string, example: "Rp 1.245.000" }
                      periodValue: { type: number, example: 320000 }
                      periodFormatted: { type: string, example: "Rp 320.000" }
                      orderCount: { type: integer, example: 27 }
                      periodOrderCount: { type: integer, example: 6 }
                      growthPercentage: { type: number, example: 5.2 }
