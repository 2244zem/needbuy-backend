                      id: { type: string, format: uuid }
                      balance: { type: string, example: "150000.00" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/transactions:
    get:
      tags: [NeedPay]
      summary: Riwayat pergerakan saldo
      description: |
        Buku besar NeedPay, terbaru dulu. `amount` selalu positif, arah
        pergerakannya ditentukan `type`, bukan tanda angkanya.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Daftar transaksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string, enum: [TOPUP, PAYMENT, REFUND] }
                        status: { type: string, enum: [PENDING, SUCCESS, FAILED, EXPIRED] }
                        amount: { type: string }
                        balanceAfter: { type: string, nullable: true }
                        orderId: { type: string, nullable: true }
                        note: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                  meta: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/withdrawals:
    post:
      tags: [NeedPay]
      summary: Ajukan penarikan saldo ke rekening bank
      description: |
        **Saldo langsung dipotong di sini**, bukan menunggu persetujuan admin.
        Kalau ditahan sampai disetujui, satu saldo yang sama bisa dijanjikan ke
        banyak pengajuan sekaligus. Nominalnya dikembalikan penuh kalau admin
        menolak (`PATCH /admin/withdrawals/{id}` dengan `action: REJECT`).

        Riwayatnya tidak punya endpoint sendiri, penarikan muncul di
        `GET /wallet/transactions` seperti mutasi dompet lainnya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, bankName, bankAccount, bankAccountName]
              additionalProperties: false
              properties:
                amount:
                  type: integer
                  minimum: 50000
                  maximum: 100000000
                  description: Rupiah bulat.
                bankName: { type: string, minLength: 2, maxLength: 60 }
                bankAccount:
                  type: string
                  minLength: 6
                  maxLength: 30
                  pattern: "^[0-9-]+$"
                bankAccountName: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "201":
          description: Penarikan tercatat berstatus PENDING, saldo sudah terpotong
        "400":
          description: Saldo tidak cukup (`INSUFFICIENT_BALANCE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /wallet/topup:
    post:
      tags: [NeedPay]
      summary: Mulai isi saldo
      description: |
        Menerbitkan Snap token untuk pembayaran top-up. **Saldo tidak bertambah
        di endpoint ini**: kredit baru terjadi setelah server menerima
        notifikasi Midtrans yang signature-nya terverifikasi, jadi menutup
        popup pembayaran tidak pernah menghasilkan saldo palsu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 10000
                  maximum: 10000000
                  description: Rupiah bulat.
      responses:
        "201":
          description: Transaksi top-up berstatus PENDING beserta Snap token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, example: PENDING }
                      amount: { type: string }
                      snapToken: { type: string, nullable: true }
                      snapRedirectUrl: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallet/topup/{id}/sync:
    post:
      tags: [NeedPay]
      summary: Tarik status top-up dari Midtrans
      description: |
        Jaring pengaman kalau notifikasi Midtrans tidak pernah sampai (server
        sempat mati, tunnel dev berganti URL, URL notifikasi belum didaftarkan).
        Tanpa ini, top-up yang sudah dibayar menggantung "menunggu pembayaran"
        selamanya.

        Yang dipercaya tetap bukan client: client hanya memicu, statusnya
        diambil server-ke-server dari API Midtrans lalu dijalankan lewat handler
        webhook yang sama: termasuk pemeriksaan signature dan kecocokan nominal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Hasil sinkronisasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      synced: { type: boolean }
                      reason:
                        type: string
                        enum: [NO_TRANSACTION, ALREADY_SETTLED]
                        description: Hanya ada kalau `synced` false.
                      status: { type: string, enum: [PENDING, SUCCESS, FAILED, EXPIRED] }
                      balance: { type: string, description: Saldo terbaru setelah sinkron. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{id}/tracking:
    get:
      tags: [Orders]
      summary: Lacak paket
      description: |
        Jejak perjalanan paket, terurut dari paling lama. `currentStage` adalah
        tahap TERJAUH yang pernah tercapai, bukan jejak terakhir yang ditulis,
        supaya catatan susulan penjual tidak membuat timeline mundur.

        Update realtime dikirim lewat socket notifikasi yang sudah ada
        (`/ws/notifications`) sebagai event `tracking`.

        **Catatan:** jejak berasal dari sistem dan penjual, bukan dari API
        kurir. Belum ada integrasi JNE/J&T/SiCepat.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Jejak paket
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      orderId: { type: string, format: uuid }
                      orderNumber: { type: string }
                      orderStatus: { type: string }
                      storeName: { type: string }
                      destination: { type: string }
                      currentStage:
                        type: string
                        nullable: true
                        enum: [PACKING, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, RETURNED, CANCELLED]
                      finished:
                        type: boolean
                        description: Perjalanan berakhir, sampai, batal, atau dikembalikan.
                      stageOrder:
                        type: array
                        items: { type: string }
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            stage: { type: string }
                            description: { type: string }
                            location: { type: string, nullable: true }
                            createdById:
                              type: string
                              nullable: true
                              description: Terisi kalau ditulis manual penjual; null untuk jejak otomatis.
                            createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [Orders]
      summary: Tambah jejak paket (penjual)
      description: |
        Hanya penjual pemilik pesanan. Kepemilikan dicek lewat relasi, bukan
        dari id yang dikirim client.

        Barisnya append-only: jejak tidak pernah diubah atau dihapus. Koreksi
        dilakukan dengan menambah baris baru.

        Pembeli menerima jejaknya seketika lewat socket.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, description]
              additionalProperties: false
              properties:
                stage:
                  type: string
                  enum: [PACKING, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, RETURNED, CANCELLED]
                description: { type: string, minLength: 3, maxLength: 200 }
                location:
                  type: string
                  maxLength: 120
                  description: Contoh "Hub Bandung". Boleh dikosongkan.
      responses:
        "201":
          description: Jejak tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object }
        "400":
          description: Pesanan belum dibayar (`ORDER_NOT_PAID`)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }