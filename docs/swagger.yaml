  /uploads/image:
    post:
      tags: [Uploads]
      summary: Unggah satu gambar atau video
      description: |
        Kirim berkas **mentah** sebagai body (bukan `multipart/form-data`),
        dengan `Content-Type` sesuai jenis berkasnya. Selain gambar (PNG, JPG,
        WebP, GIF), endpoint ini menerima video pendek (MP4, WebM) untuk
        lampiran ulasan. Di browser cukup:

        ```js
        await apiClient.post('/uploads/image', file, {
          headers: { 'Content-Type': file.type },
        });
        ```

        Respons berisi `url` absolut yang bisa langsung dipakai sebagai `src`,
        atau disimpan ke field seperti `sellers.logoUrl`.

        **Keamanan:**
        - Jenis berkas ditentukan dari **magic bytes**, bukan dari header
          `Content-Type` yang dikirim client, header itu gampang dipalsukan.
        - **SVG ditolak**: itu dokumen XML yang boleh memuat `<script>`, dan
          menyajikannya same-origin akan jadi stored XSS.
        - Nama berkas selalu dibuat server (`uuid` + ekstensi hasil deteksi);
          nama dari client tidak pernah dipakai, sehingga path traversal dan
          penimpaan berkas orang lain tidak mungkin terjadi.
        - Maksimal 20 MB, dan wajib login. Batas ini dinaikkan dari 3 MB sejak
          ulasan pembeli boleh melampirkan video pendek; gambar tetap jauh di
          bawahnya.
        - Tidak ada berkas di disk sama sekali, sehingga path traversal tidak
          mungkin terjadi.

        **Ketahanan:** byte disimpan di tabel `uploads` di Postgres, jadi ikut
        serta dalam backup database dan tidak hilang saat server dipindah atau
        di-deploy ulang.

        Berkas disajikan di `GET /uploads/{id}` (di luar `/api/v1`) dengan
        `Cache-Control: immutable`, isi sebuah id tidak pernah berubah.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
          video/mp4:
            schema: { type: string, format: binary }
          video/webm:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Berkas tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: http://localhost:4000/uploads/6f1c…-9b2a.png
                      bytes: { type: integer, example: 48213 }
                      kind:
                        type: string
                        enum: [IMAGE, VIDEO]
                        description: Ditentukan server dari magic bytes, bukan dari `Content-Type` kiriman client.
        "400":
          description: Berkas kosong (`EMPTY_FILE`) atau jenisnya belum didukung (`UNSUPPORTED_MEDIA`)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Berkas melebihi 20 MB
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /notifications:
    get:
      tags: [Notifications]
      summary: Daftar notifikasi milik user yang login
      description: |
        Notifikasi bertipe `ORDER_NEW` membawa `order` hasil join: id order,
        nomor order, tipe order (metode bayar), status, dan daftar barang yang
        dipesan. Isi order sengaja tidak disalin ke tabel notifikasi supaya
        selalu ikut order aslinya.
      parameters:
        - name: page
          in: query
          description: Halaman ke berapa, 1-based. Dipakai tombol "muat lebih banyak".
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Daftar notifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type:
                          type: string
                          enum: [ORDER_NEW, ORDER_STATUS, PAYMENT, LOW_STOCK, REVIEW]
                        title: { type: string, example: Orderan baru masuk }
                        message: { type: string }
                        read: { type: boolean, example: false }
                        readAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        order:
                          type: object
                          nullable: true
                          properties:
                            orderId: { type: string, format: uuid }
                            orderNumber: { type: string }
                            orderType:
                              type: string
                              nullable: true
                              description: Metode bayar (MIDTRANS/COD)
                            status: { type: string, example: PROCESSING }
                            total: { type: number, example: 300000 }
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  productId: { type: string, format: uuid }
                                  productName: { type: string }
                                  quantity: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Jumlah notifikasi yang belum dibaca (badge bel)
      description: |
        Dipakai untuk badge merah di bel header. Angka yang sama juga di-push
        lewat WebSocket `/ws/notifications` sebagai event `unread-count`, jadi
        endpoint ini cukup dipanggil sekali saat halaman dimuat.
      responses:
        "200":
          description: Jumlah belum dibaca
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unreadCount: { type: integer, example: 3 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Tandai semua notifikasi sebagai sudah dibaca
      responses:
