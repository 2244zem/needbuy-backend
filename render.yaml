# Blueprint Render — dibaca otomatis saat repo ini dihubungkan lewat
# "New + → Blueprint". Kalau kamu membuat Web Service secara manual, berkas ini
# boleh diabaikan; isian di dashboard-nya sama persis dengan yang di sini.
#
# Database sengaja TIDAK didefinisikan di sini: Postgres gratis Render hanya
# berumur 90 hari, sedangkan Supabase gratis tanpa batas waktu. Isi
# DATABASE_URL dan DIRECT_URL secara manual dari dashboard Supabase.
services:
  - type: web
    name: needbuy-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    # `prisma migrate deploy` ikut di start supaya skema database selalu
    # menyusul kode yang baru di-deploy, tanpa langkah manual.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Sisanya diisi lewat dashboard (Environment → Add Environment Variable).
      # sync: false berarti Render tidak menyimpan nilainya di berkas ini.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
